    return true;
  });
  setTimeout(()=>{
    const del = document.getElementById('m-delete');
    if(del) del.onclick = ()=>{
      if(confirm('Delete supplier ' + s.name + '? Items assigned to them will be unassigned, not deleted.')){
        dbRef('suppliers/' + sid).remove();
        Object.entries(State.screwItems||{}).filter(([k,i])=>i.supplierId===sid).forEach(([k])=> dbRef('screwItems/'+k+'/supplierId').set(null));
        Object.entries(State.consumableTypes||{}).filter(([k,t])=>t.supplierId===sid).forEach(([k])=> dbRef('consumableTypes/'+k+'/supplierId').set(null));
        closeModal();
      }
    };
  });
}

/* ---------- Admin Tab ---------- */
function renderAdminTab(){
  const container = el('div','');
  const users = [...State.sharedUsers].sort((a,b)=> a.username.localeCompare(b.username));
  const iAmMainRoot = currentUserIsMainRoot();

  const card = el('div','card');
  card.innerHTML = `<h2>Users</h2><div class="sub">Same shared team as your other Oak Joinery apps. Manage who can log in and what each person can do.</div>`;
  const table = document.createElement('table');
  table.innerHTML = `<thead><tr><th>Username</th><th>Role</th><th>Apps</th><th></th></tr></thead>`;
  const tbody = document.createElement('tbody');
  users.forEach(u=>{
    const tr = document.createElement('tr');
    const roleLabel = isMainRoot(u) ? 'Main root' : (u.isRoot ? 'Root' : 'Standard');
    const appsLabel = isMainRoot(u) ? 'All apps' : Object.keys(APP_LABELS).filter(a=>userHasApp(u,a)).map(a=>APP_LABELS[a]).join(', ') || 'No apps';
    tr.innerHTML = `<td>${escapeHtml(u.username)}</td><td>${roleLabel}</td><td class="sub" style="font-size:12px;">${escapeHtml(appsLabel)}</td><td></td>`;
    const actionsTd = tr.lastElementChild;
    if(can('manageUsers') && !(isMainRoot(u) && !iAmMainRoot)){
      actionsTd.appendChild(smallBtn('Edit', ()=> openEditUserModal(u.id)));
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  card.appendChild(table);

  if(can('manageUsers')){
    const row = el('div','btn-row');
    const addBtn = document.createElement('button');
    addBtn.className = 'btn btn-amber';
    addBtn.textContent = '+ Add user';
    addBtn.onclick = openAddUserModal;
    row.appendChild(addBtn);
    card.appendChild(row);
  }
  container.appendChild(card);

  if(State.currentUser.isRoot){
    const locCard = el('div','card');
    const locations = (State.locations && State.locations.length) ? State.locations : ['Main'];
    locCard.innerHTML = `<h2>Locations</h2><div class="sub">Where screws and consumable containers are physically kept — each shows as its own section on the Consumables and Liquid tabs.</div>`;
    const locList = el('div','stack');
    locations.forEach((l, i) => {
      const row = el('div','user-row');
      const nameDiv = document.createElement('div');
      nameDiv.style.fontWeight = '600';
      nameDiv.textContent = l;
      row.appendChild(nameDiv);
      if(locations.length > 1){
        row.appendChild(smallBtn('Remove', async ()=>{
          const boardsHere = Object.values(State.screwItems||{}).some(item => screwQtyAt(item, l) > 0)
            || Object.values(State.consumableUnits||{}).some(u => (u.location || locations[0]) === l && u.fillLevel !== 'Finished');
          if(boardsHere && !confirm(`Some stock is still recorded at "${l}". Remove this location anyway? That stock will no longer be shown anywhere.`)) return;
          const newLocations = locations.filter((x,idx)=>idx!==i);
          await dbRef('meta').update({ locations: newLocations });
          toast(l + ' removed.', 'ok');
        }));
      }
      locList.appendChild(row);
    });
    locCard.appendChild(locList);
    const addRow = el('div','btn-row');
    const nameInput = document.createElement('input');
    nameInput.placeholder = 'e.g. Sandton';
    nameInput.style.width = 'auto';
    nameInput.style.flex = '1';
    const addBtn2 = document.createElement('button');
    addBtn2.className = 'btn btn-amber';
    addBtn2.textContent = 'Add location';
    addBtn2.onclick = async ()=>{
      const name = nameInput.value.trim();
      if(!name){ toast('Enter a location name', 'err'); return; }
      if(locations.some(l=>l.toLowerCase()===name.toLowerCase())){ toast('That location already exists', 'err'); return; }
      await dbRef('meta').update({ locations: [...locations, name] });
      nameInput.value = '';
      toast(name + ' added.', 'ok');
    };
    addRow.appendChild(nameInput);
    addRow.appendChild(addBtn2);
    locCard.appendChild(addRow);
    container.appendChild(locCard);
  }

  if(State.currentUser.isRoot){
    const shareCard = el('div','card');
    shareCard.innerHTML = `<h2>Share this app</h2><div class="sub">Send this page's link to your team so they can log in from their own phone or laptop.</div>`;
    const linkRow = el('div','btn-row');
    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn';
    copyBtn.textContent = 'Copy link';
    copyBtn.onclick = ()=>{
      navigator.clipboard.writeText(window.location.href).then(()=> toast('Link copied', 'ok'));
    };
    linkRow.appendChild(copyBtn);
    shareCard.appendChild(linkRow);
    container.appendChild(shareCard);

    const emailCard = el('div','card');
    emailCard.innerHTML = `<h2>Reorder email settings</h2><div class="sub">Where reorder alerts get sent, via EmailJS.</div>`;
    const form = el('div','');
    form.innerHTML = `
      <label>Reorder alert recipient email</label>
      <input type="text" id="ec-email" value="${escapeHtml(CONFIG.REORDER_EMAIL||'')}">
      <label>EmailJS Service ID</label>
      <input type="text" id="ec-service" value="${escapeHtml(CONFIG.EMAILJS_SERVICE_ID||'')}">
      <label>EmailJS Template ID</label>
      <input type="text" id="ec-template" value="${escapeHtml(CONFIG.EMAILJS_TEMPLATE_ID||'')}">
      <label>EmailJS Public Key</label>
      <input type="text" id="ec-key" value="${escapeHtml(CONFIG.EMAILJS_PUBLIC_KEY||'')}">
      <div class="btn-row"><button class="btn btn-amber" id="ec-save">Save</button></div>
    `;
    emailCard.appendChild(form);
    container.appendChild(emailCard);
    setTimeout(()=>{
      document.getElementById('ec-save').onclick = ()=>{
        CONFIG.REORDER_EMAIL = document.getElementById('ec-email').value.trim();
        CONFIG.EMAILJS_SERVICE_ID = document.getElementById('ec-service').value.trim();
        CONFIG.EMAILJS_TEMPLATE_ID = document.getElementById('ec-template').value.trim();
        CONFIG.EMAILJS_PUBLIC_KEY = document.getElementById('ec-key').value.trim();
        dbRef('meta').set({
          reorderEmail: CONFIG.REORDER_EMAIL,
          emailjsServiceId: CONFIG.EMAILJS_SERVICE_ID,
          emailjsTemplateId: CONFIG.EMAILJS_TEMPLATE_ID,
          emailjsPublicKey: CONFIG.EMAILJS_PUBLIC_KEY
        });
        if(CONFIG.EMAILJS_PUBLIC_KEY){ try{ emailjs.init(CONFIG.EMAILJS_PUBLIC_KEY); }catch(e){} }
        toast('Email settings saved — shared with every device', 'ok');
      };
    });
  }

  return container;
}

function appAccessChecklistHtml(prefix, apps, iAmMainRoot){
  return `<label>Which apps can they use?${iAmMainRoot?'':' (main root only)'}</label>
    <div class="checklist" style="${iAmMainRoot?'':'opacity:.5;'}">
      ${Object.keys(APP_LABELS).map(a=>`<label><input type="checkbox" class="${prefix}-app" data-app="${a}" ${apps[a]?'checked':''} ${iAmMainRoot?'':'disabled'}> ${APP_LABELS[a]}</label>`).join('')}
    </div>`;
}
function readAppAccessChecklist(prefix, iAmMainRoot, existing){
  if(!iAmMainRoot) return existing || defaultApps();
  const apps = {};
  document.querySelectorAll('.'+prefix+'-app').forEach(cb=>{ apps[cb.dataset.app] = cb.checked; });
  return apps;
}

function openAddUserModal(){
  const iAmMainRoot = currentUserIsMainRoot();
  openModal('Add user', `
    <label>Username</label>
    <input type="text" id="m-username">
    <label>PIN (at least 4 characters)</label>
    <input type="text" id="m-pin">
    <label>Email signature (pasted from your Outlook signature — used to sign reorder emails)</label>
    <textarea id="m-signature" rows="4" style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:7px;font-size:14px;font-family:var(--sans);"></textarea>
    <label><input type="checkbox" id="m-isroot" style="width:auto;display:inline-block;margin-right:6px"> Root user (full access to their apps, manages other users)</label>
    ${appAccessChecklistHtml('nu', defaultApps(), iAmMainRoot)}
    <div id="m-perms-wrap">
      <label>What can they do in this app?</label>
      <div class="checklist">
        <label><input type="checkbox" id="p-consHandOut" checked> Hand out items</label>
        <label><input type="checkbox" id="p-consManageConsumables" checked> Update container fill levels</label>
        <label><input type="checkbox" id="p-consManageItems"> Add/edit items &amp; reorder levels</label>
        <label><input type="checkbox" id="p-consViewReports" checked> View reports</label>
        <label><input type="checkbox" id="p-consExportExcel" checked> Export to Excel</label>
        <label><input type="checkbox" id="p-consSendToDispatch"> Send to Dispatch</label>
      </div>
    </div>
  `, async ()=>{
    const username = document.getElementById('m-username').value.trim();
    const pin = document.getElementById('m-pin').value;
    const signature = document.getElementById('m-signature').value.trim();
    const isRoot = document.getElementById('m-isroot').checked;
    if(!username || pin.length < 4){ toast('Enter a username and a PIN of at least 4 characters', 'err'); return false; }
    if(State.sharedUsers.some(u=>u.username.toLowerCase()===username.toLowerCase())){
      toast('That username is taken', 'err'); return false;
    }
    const permissions = {
      consHandOut: document.getElementById('p-consHandOut').checked,
      consManageConsumables: document.getElementById('p-consManageConsumables').checked,
      consManageItems: document.getElementById('p-consManageItems').checked,
      consViewReports: document.getElementById('p-consViewReports').checked,
      consExportExcel: document.getElementById('p-consExportExcel').checked,
      consSendToDispatch: document.getElementById('p-consSendToDispatch').checked,
      manageUsers: false
    };
    const apps = readAppAccessChecklist('nu', iAmMainRoot, null);
    State.sharedUsers.push({ id: uid(), username, pin: await hashPin(pin), consEmailSignature: signature, isRoot, permissions, apps });
    await saveSharedUsers();
    return true;
  });
}

function openEditUserModal(id){
  const u = State.sharedUsers.find(x=>x.id===id);
  if(!u) return;
  if(isMainRoot(u) && !currentUserIsMainRoot()){ toast('Only the main root account can edit itself.', 'err'); return; }
  const iAmMainRoot = currentUserIsMainRoot();
  const perms = u.permissions || DEFAULT_PERMS;
  const apps = u.apps || defaultApps();
  openModal('Edit ' + u.username, `
    <label>Username</label>
    <input type="text" id="m-username" value="${escapeHtml(u.username)}">
    <label>PIN</label>
    <input type="text" id="m-pin" placeholder="Leave blank to keep current PIN">
    <label>Email signature (pasted from your Outlook signature — used to sign reorder emails)</label>
    <textarea id="m-signature" rows="4" style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:7px;font-size:14px;font-family:var(--sans);">${escapeHtml(u.consEmailSignature||'')}</textarea>
    ${isMainRoot(u) ? '' : `<label><input type="checkbox" id="m-isroot" ${u.isRoot?'checked':''} style="width:auto;display:inline-block;margin-right:6px"> Root user</label>`}
    ${appAccessChecklistHtml('eu', apps, iAmMainRoot)}
    <label style="margin-top:8px;">What can they do in this app?</label>
    <div class="checklist">
      <label><input type="checkbox" id="p-consHandOut" ${perms.consHandOut?'checked':''}> Hand out items</label>
      <label><input type="checkbox" id="p-consManageConsumables" ${perms.consManageConsumables?'checked':''}> Update container fill levels</label>
      <label><input type="checkbox" id="p-consManageItems" ${perms.consManageItems?'checked':''}> Add/edit items &amp; reorder levels</label>
      <label><input type="checkbox" id="p-consViewReports" ${perms.consViewReports?'checked':''}> View reports</label>
      <label><input type="checkbox" id="p-consExportExcel" ${perms.consExportExcel?'checked':''}> Export to Excel</label>
      <label><input type="checkbox" id="p-consSendToDispatch" ${perms.consSendToDispatch?'checked':''}> Send to Dispatch</label>
    </div>
    ${isMainRoot(u) ? '' : `<div class="btn-row"><button class="btn btn-danger" id="m-delete" type="button">Delete this user</button></div>`}
  `, async ()=>{
    if(isMainRoot(u) && !currentUserIsMainRoot()) return false; // belt and braces
    const username = document.getElementById('m-username').value.trim();
    const pin = document.getElementById('m-pin').value;
    const signature = document.getElementById('m-signature').value.trim();
    const isRootBox = document.getElementById('m-isroot');
    if(!username){ toast('Enter a username', 'err'); return false; }
    const newPerms = {
      consHandOut: document.getElementById('p-consHandOut').checked,
      consManageConsumables: document.getElementById('p-consManageConsumables').checked,
      consManageItems: document.getElementById('p-consManageItems').checked,
      consViewReports: document.getElementById('p-consViewReports').checked,
      consExportExcel: document.getElementById('p-consExportExcel').checked,
      consSendToDispatch: document.getElementById('p-consSendToDispatch').checked,
      manageUsers: (u.permissions && u.permissions.manageUsers) || false
    };
    u.username = username;
    if(pin) u.pin = await hashPin(pin);
    u.consEmailSignature = signature;
    // Merge, don't replace — replacing wiped this person's permissions in
    // the other three apps (Dispatch, Stock List, Board Stock).
    u.permissions = { ...(u.permissions || {}), ...newPerms };
    u.isRoot = isMainRoot(u) ? true : (isRootBox ? isRootBox.checked : u.isRoot);
    u.apps = isMainRoot(u) ? defaultApps() : readAppAccessChecklist('eu', iAmMainRoot, apps);
    await saveSharedUsers();
    return true;
  });
  setTimeout(()=>{
    const del = document.getElementById('m-delete');
    if(del) del.onclick = async ()=>{
      if(id === State.currentUser.id){ toast("You can't delete the account you're logged in as", 'err'); return; }
      if(u.isRoot && State.sharedUsers.filter(x=>x.isRoot).length <= 1){ toast("You can't delete the only root account — make another user root first", 'err'); return; }
      if(confirm('Remove user ' + u.username + '? They will no longer be able to log in to any app.')){
        State.sharedUsers = State.sharedUsers.filter(x=>x.id!==id);
        await saveSharedUsers();
        closeModal();
      }
    };
  });
}

/* ---------- Modal helper ---------- */
function openModal(title, bodyHtml, onSave){
  closeModal();
  const bg = el('div','modal-bg');
  bg.id = 'active-modal';
  const modal = el('div','modal');
  modal.innerHTML = `<button class="modal-close" id="modal-x">&times;</button><h3>${title}</h3><div id="modal-body">${bodyHtml}</div><div class="btn-row"><button class="btn btn-amber" id="modal-save">Save</button><button class="btn btn-ghost" id="modal-cancel">Cancel</button></div>`;
  bg.appendChild(modal);
  document.body.appendChild(bg);
  document.getElementById('modal-x').onclick = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-save').onclick = ()=>{
    const ok = onSave();
    if(ok !== false) closeModal();
  };
  bg.addEventListener('click', e=>{ if(e.target === bg) closeModal(); });
}
function closeModal(){
  const m = document.getElementById('active-modal');
  if(m) m.remove();
}

if ('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
initFirebase();
