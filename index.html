<!--
  CLAUDE DEV NOTES (keep this updated across sessions)
  =====================================================
  App: Screws / Thinners / Wood Stopping stock tracker for Oak Joinery (Pty) Ltd.
  Third app in the family, alongside board-stock-app and oak-joinery-stock-board.
  SHARED Firebase Realtime Database project with the Dispatch/Stock List/Board Stock
  apps (migrated 2026-09-11) — see SHARED AUTH further down. This app's own data
  below stays at its own DB_PATH, untouched by that; only users[] is shared.

  DATA MODEL (Firebase Realtime Database, root path configurable via CONFIG.DB_PATH):
    /screwItems/{id}       -> { size, bundleSize, qtyByLocation:{locationName:number}, reorderQty, reorderSent(bool) }
    /consumableTypes/{id}  -> { name, category ('liquid'|'stopping'|'other'), reorderQty, reorderSent(bool) }
    /consumableUnits/{id}  -> { typeId, fillLevel ('Full'|'3/4'|'1/2'|'1/4'|'Finished'), createdDate, location }
    /people/{id}           -> { name }
    /transactions/{id}     -> { personId, itemType('screw'|'consumable'), itemId, itemLabel, qty, date (YYYY-MM-DD), month (YYYY-MM) }
    /suppliers/{id}        -> { name, email }
    /meta                  -> { reorderEmail, emailjsServiceId, emailjsTemplateId, emailjsPublicKey, locations:["Main",...] }

  LOCATIONS (added 2026-09-21, per user request: "i want the same in
  consumables" — mirrors board-stock-app's locations feature). Root-managed
  fixed list at meta.locations (Admin tab). Screw items: qtyBundles ->
  qtyByLocation, same object-keyed-by-location pattern as board-stock-app's
  board.qty; migrateLegacyScrewQty() converts any item still on the old
  plain-number shape the first time it's seen. Consumable units are simpler
  since each one already IS a single physical container — just gained a
  `location` field, and the Consumables tab groups each type's containers
  into per-location sub-sections. A unit with no location (predates this
  change) is shown under the first location in the list.

  LIQUID VOLUME TRACKING (added 2026-09-22, per user request: "change
  the liquid to 750ml each time it gets used...restock level of 20L").
  Liquid-category types no longer use consumableUnits/fill-level at all
  — replaced by volumeByLocation (ml, per location, same pattern as
  screwItems.qtyByLocation) and reorderLevelMl (a single ml threshold,
  e.g. 20000 for "20L"). renderLiquidCard() is a completely separate
  render path from the fill-level card non-liquid types still use.
  openUseLiquidModal() mirrors openHandOutModal() for screws — same
  person-picker pattern, default 750ml (DEFAULT_USE_ML), adjustable.
  openRestockLiquidModal() takes liters and converts to ml. Existing
  consumableUnits for a type that gets switched to 'liquid' are left
  alone (not deleted, not migrated — there's no reliable way to convert
  fill-level fractions into an absolute ml figure without knowing each
  container's size), they simply stop being shown once the type is
  liquid. consumableTypeQty()/consumableTypeReorderLevel()/
  isConsumableTypeLow() are the one shared branch point every low-stock
  check (reports, supplier low-count, manual reorder email) now goes
  through, instead of five separate copies of the container-count logic.

  SEND TO DISPATCH (added 2026-09-22, per user request: "i want a
  section off sending from consumables to dispatch as well"): new tab,
  gated by consSendToDispatch, covers screw bundles AND liquid ml (not
  fill-level containers — no clean single "qty" to deduct there). Same
  mechanism as Board Stock Take's own version: deducts stock here,
  writes a new Unfinished item into the shared 'dispatchBoard/items',
  recipeSnapshot:[{sourceApp:'consumablesStock', kind:'screw'|'liquid',
  itemId, desc, deductQty, location}] — kind is what tells Dispatch's
  returnItemToStock() whether to credit back qtyByLocation or
  volumeByLocation when reversed.

  LIQUID CATEGORY (added 2026-09-21, per user request: "i want a liquid
  button so that if or in case thinners work in 1/4 sections glue works
  the same"): consumableTypes.category was documented but never actually
  implemented in the add/edit form until now — categorySelectHtml() adds
  it, with 'liquid' covering thinners/glue/anything tracked the same way.
  The underlying fill-level (1/4 etc.) tracking already applied to every
  consumable type regardless of category, so "glue works the same" was
  already true mechanically; this just labels liquid items consistently
  (💧 tag) wherever they appear.

  Screws and consumable types both carry a `supplierId` (nullable) set from a dropdown on their
  add/edit modals. Reorder emails are bundled per supplier: when an item crosses its reorder
  threshold it's queued (see reorderQueue / enqueueReorder), and after a short debounce
  (flushReorderQueue, ~3s) one email per supplier goes out listing every item from them that
  needs reordering, sent to that supplier's own email (falls back to CONFIG.REORDER_EMAIL if no
  supplier is set), CC'd to the supplier's ccEmail if set. Body: "Good day {contact person}," /
  "I hope this email finds you well." / "Please quote me on the following:" / itemised list /
  "Kind regards," + the signature of whichever logged-in user's action triggered the reorder
  (users/{id}/consEmailSignature, falls back to their username). The Suppliers tab also has a
  manual "Send reorder email now" per supplier that bypasses the queue for testing/ad-hoc use.

  AUTH: shared with the Dispatch/Stock List/Board Stock apps (see SHARED AUTH further
  down) — username + PIN (SHA-256 hashed), stored on 'dispatchBoard/users', not this
  app's own DB_PATH. Root config (Firebase project keys +
  EmailJS keys) is entered once via the Setup screen and stored in localStorage on that device
  (mirrors board-stock-app's approach: keys are not pushed to the DB itself, only emailConfig
  routing fields are, since anyone with DB read access could see them otherwise... actually see
  CONFIG block below, Firebase config IS baked into the file at deploy time by root, simplest &
  matches the other two apps).

  REORDER LOGIC: on every qty change, check item's qty/active-unit-count against reorderQty.
  If at/below threshold and reorderSent is false -> send EmailJS alert, set reorderSent=true.
  If restocked back above threshold -> reset reorderSent=false so a future dip alerts again.

  EXCEL EXPORT: SheetJS (xlsx), client-side, per-person monthly transaction history.

  STATUS: initial build, not yet deployed. Root needs to create a Firebase project + Realtime
  Database and paste the config into FIREBASE_CONFIG below (see SETUP.md), same as board-stock-app.
-->

  .fill-toggle{display:flex;gap:6px;flex-wrap:wrap;}

<script>
/* =========================================================================
   CONFIG — root fills this in once via the Setup screen (see SETUP.md).
   Baked into localStorage on first run so it doesn't need to live in the DB.
   ========================================================================= */
// Shared with the Dispatch/Stock List/Board Stock apps — same Firebase
// project/database (per user request, replacing this app's original
// paste-your-own-config setup screen). This app's OWN data (screws,
// consumables, people, transactions, suppliers) still lives at its own
// DB_PATH below, so it doesn't collide with 'dispatchBoard'/'stockList'/
// 'boardStock' — only users comes from the shared 'dispatchBoard/users'
// path (see SHARED AUTH section further down).
const CONFIG = {
  FIREBASE_CONFIG: {
    apiKey: "AIzaSyCkoUkLIlxdxD2AAEpLGW4dzqkSeC5lVh0",
    authDomain: "oak-joinery-stock-dispatch.firebaseapp.com",
    databaseURL: "https://oak-joinery-stock-dispatch-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "oak-joinery-stock-dispatch",
    storageBucket: "oak-joinery-stock-dispatch.firebasestorage.app",
    messagingSenderId: "538461584463",
    appId: "1:538461584463:web:b84319c125e9bf9a47be3a"
  },
  DB_PATH: "consumablesStock",
  EMAILJS_PUBLIC_KEY: "",
  EMAILJS_SERVICE_ID: "",
  EMAILJS_TEMPLATE_ID: "",
  REORDER_EMAIL: ""
};

/* =========================================================================
   STATE
   ========================================================================= */
const State = {
  db: null,
  dispatchBoardRef: null,   // shared 'dispatchBoard' node — users only
  sharedUsers: [],          // synced live from dispatchBoard/users
  currentUser: null, // an entry from sharedUsers: {id, username, pin, isRoot, isMainRoot, apps, permissions}
  screwItems: {},
  consumableTypes: {},
  consumableUnits: {},
  people: {},
  transactions: {},
  suppliers: {},
  activeTab: 'screws',
  ready: false,
  locations: ['Main']
};

const FILL_LEVELS = ['Full','3/4','1/2','1/4','Finished'];

// --- LOCATIONS (added 2026-09-21, per user request: "i want the same
// in consumables" — mirrors board-stock-app's own locations feature
// exactly, see that app's dev notes for the fuller rationale). Screw
// items change from a single qtyBundles number to qtyByLocation, an
// object keyed by location name — same pattern as board.qty there.
// Consumable units (thinners/glue/stopping containers) get a simpler
// treatment: each unit already IS one physical container, so it just
// gets its own `location` field rather than needing a number-object.
function totalScrewQty(item){
  if(typeof item.qtyBundles === 'number') return item.qtyBundles; // not yet migrated
  return Object.values(item.qtyByLocation || {}).reduce((a,b)=>a+(Number(b)||0), 0);
}
function screwQtyAt(item, location){
  if(typeof item.qtyBundles === 'number') return location === (State.locations||['Main'])[0] ? item.qtyBundles : 0;
  return (item.qtyByLocation && item.qtyByLocation[location]) || 0;
}
function migrateLegacyScrewQty(item){
  if(typeof item.qtyBundles === 'number'){
    const firstLoc = (State.locations && State.locations[0]) || 'Main';
    item.qtyByLocation = { [firstLoc]: item.qtyBundles };
    delete item.qtyBundles;
    return true; // caller should persist this back
  }
  return false;
}
// Namespaced ("cons...") per user request to share the SAME users[]/
// permissions object as the Dispatch, Stock List, and Board Stock apps —
// unprefixed keys here would clash with similarly-named permissions in
// those apps. manageUsers is the one exception: it's the same concept
// (can edit the shared roster) everywhere, so it stays unprefixed.
const DEFAULT_PERMS = { manageUsers:false, consManageItems:false, consHandOut:true, consManageConsumables:true, consViewReports:true, consExportExcel:true, consSendToDispatch:false };

function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function monthKey(d){ return d.slice(0,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthLabel(mk){
  const [y,m] = mk.split('-');
  return new Date(y, m-1, 1).toLocaleString('default',{month:'long', year:'numeric'});
}

function toast(msg, type){
  const holder = document.getElementById('toast-holder');
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'');
  el.textContent = msg;
  holder.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

/* =========================================================================
   FIREBASE INIT + SYNC
   ========================================================================= */
function initFirebase(){
  try{
    if(!firebase.apps.length) firebase.initializeApp(CONFIG.FIREBASE_CONFIG);
    State.db = firebase.database();
    State.dispatchBoardRef = firebase.database().ref('dispatchBoard');
  }catch(e){
    toast('Firebase init failed: ' + e.message, 'err');
    return;
  }
  attachListeners();
  startSharedUsersSync();
}

function attachListeners(){
  const base = State.db.ref(CONFIG.DB_PATH);
  base.child('screwItems').on('value', snap => {
    State.screwItems = snap.val() || {};
    // Migrate any item still on the OLD single-number qtyBundles the
    // first time it's seen, and persist that back so it only happens
    // once per item.
    Object.entries(State.screwItems).forEach(([id, item]) => {
      if(migrateLegacyScrewQty(item)) dbRef('screwItems/' + id).set(item);
    });
    onDataChange();
  });
  base.child('consumableTypes').on('value', snap => { State.consumableTypes = snap.val() || {}; onDataChange(); });
  base.child('consumableUnits').on('value', snap => { State.consumableUnits = snap.val() || {}; onDataChange(); });
  base.child('people').on('value', snap => { State.people = snap.val() || {}; onDataChange(); });
  base.child('transactions').on('value', snap => { State.transactions = snap.val() || {}; onDataChange(); });
  base.child('suppliers').on('value', snap => { State.suppliers = snap.val() || {}; onDataChange(); });
  base.child('meta').on('value', snap => {
    const m = snap.val() || {};
    CONFIG.REORDER_EMAIL = m.reorderEmail || '';
    CONFIG.EMAILJS_SERVICE_ID = m.emailjsServiceId || '';
    CONFIG.EMAILJS_TEMPLATE_ID = m.emailjsTemplateId || '';
    CONFIG.EMAILJS_PUBLIC_KEY = m.emailjsPublicKey || '';
    // Root-managed fixed list, per user request ("i want the same in
    // consumables" — mirrors board-stock-app's own locations feature).
    // "Main" default keeps existing screw/consumable-unit records
    // (which predate this and have no location field/key yet) showing
    // up somewhere sensible rather than vanishing from view.
    State.locations = (Array.isArray(m.locations) && m.locations.length) ? m.locations : ['Main'];
    if(CONFIG.EMAILJS_PUBLIC_KEY){ try{ emailjs.init(CONFIG.EMAILJS_PUBLIC_KEY); }catch(e){} }
    onDataChange();
  });
  State.ready = true;
}

function dbRef(path){ return State.db.ref(CONFIG.DB_PATH + '/' + path); }

let renderQueued = false;
function onDataChange(){
  if(renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(()=>{ renderQueued = false; render(); });
}

/* =========================================================================
   SHARED AUTH — same users[]/permissions system as the Dispatch, Stock
   List, and Board Stock apps (per user request: "use the same api and
   bin as the other apps and the same app permissions"). Login/user
   management lives on the shared 'dispatchBoard/users' path; this app's
   OWN data (screws, consumables, people, transactions, suppliers) stays
   at CONFIG.DB_PATH, untouched by any of this.
   ========================================================================= */
const APP_ID = "consumables";
const APP_LABELS = { dispatch: "Dispatch app", stock: "Stock List app", boardStock: "Board Stock app", consumables: "Consumables app" };
function defaultApps(){ return { dispatch: true, stock: true, boardStock: true, consumables: true }; }
function getMainRoot(){ return State.sharedUsers.find(u => u.isMainRoot) || State.sharedUsers.find(u => u.isRoot) || null; }
function isMainRoot(u){ const mr = getMainRoot(); return !!(u && mr && u.id === mr.id); }
function currentUserIsMainRoot(){ return isMainRoot(State.currentUser); }
function userHasApp(u, appId){
  appId = appId || APP_ID;
  if(!u) return false;
  if(isMainRoot(u)) return true;
  if(!u.apps) return true; // legacy account — not yet scoped
  return !!u.apps[appId];
}
async function hashPin(pin){
  const enc = new TextEncoder().encode(pin);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function saveSharedUsers(){
  if(!State.dispatchBoardRef) return;
  try{ await State.dispatchBoardRef.child('users').set(State.sharedUsers); }catch(e){ toast('Could not save users: ' + e.message, 'err'); }
}
function startSharedUsersSync(){
  if(!State.dispatchBoardRef) return;
  State.dispatchBoardRef.child('users').on('value', snap => {
    State.sharedUsers = Array.isArray(snap.val()) ? snap.val() : [];
    onDataChange();
  });
}

const SESSION_KEY = 'consumablesStockSession';

async function attemptLogin(username, pin){
  const u = State.sharedUsers.find(x => x.username.toLowerCase() === username.trim().toLowerCase() && userHasApp(x));
  if(!u) return 'No user with that username has access to this app.';
  const enteredHash = await hashPin(pin.trim());
  if(enteredHash !== u.pin) return 'Incorrect PIN.';
  State.currentUser = u;
  sessionStorage.setItem(SESSION_KEY, JSON.stringify({id: u.id}));
  render();
  return null;
}

function tryRestoreSession(){
  try{
    const raw = sessionStorage.getItem(SESSION_KEY);
    if(!raw) return;
    const {id} = JSON.parse(raw);
    const u = State.sharedUsers.find(x => x.id === id);
    if(u && userHasApp(u)) State.currentUser = u;
  }catch(e){}
}

function logout(){
  sessionStorage.removeItem(SESSION_KEY);
  State.currentUser = null;
  render();
}

function can(perm){
  if(!State.currentUser) return false;
  if(State.currentUser.isRoot) return true;
  return !!(State.currentUser.permissions && State.currentUser.permissions[perm]);
}
function currentUserIsRoot(){ return !!(State.currentUser && State.currentUser.isRoot); }

/* =========================================================================
   REORDER EMAIL — bundled per supplier
   ========================================================================= */
let reorderQueue = {}; // supplierId (or '__none') -> [{itemLabel, currentQty, reorderQty}]
let reorderFlushTimer = null;

// Email sending moved server-side (weekly digest via GitHub Actions,
// see dev notes) — this app no longer sends reorder emails itself the
// instant something crosses its threshold. reorderSent is kept only as
// harmless historical bookkeeping; nothing reads it anymore.
function checkReorder(kind, id, label, currentQty, reorderQty, currentlySent, supplierId, isVolume){
  const belowThreshold = currentQty <= reorderQty;
  const path = kind === 'screw' ? 'screwItems' : 'consumableTypes';
  if(belowThreshold && !currentlySent){
    dbRef(path + '/' + id + '/reorderSent').set(true);
  } else if(!belowThreshold && currentlySent){
    dbRef(path + '/' + id + '/reorderSent').set(false);
  }
}

function enqueueReorder(supplierId, itemLabel, currentQty, reorderQty, isVolume){
  const key = supplierId || '__none';
  reorderQueue[key] = reorderQueue[key] || [];
  reorderQueue[key].push({ itemLabel, currentQty, reorderQty, isVolume });
  if(reorderFlushTimer) clearTimeout(reorderFlushTimer);
  // short delay so several items dropping below threshold around the same time
  // (e.g. a batch of fill-level updates) land in one email per supplier
  reorderFlushTimer = setTimeout(flushReorderQueue, 3000);
}

function flushReorderQueue(){
  const queued = reorderQueue;
  reorderQueue = {};
  reorderFlushTimer = null;
  Object.entries(queued).forEach(([supplierId, items])=> sendSupplierReorderEmail(supplierId, items));
}

function sendSupplierReorderEmail(supplierId, items){
  const supplier = (supplierId && supplierId !== '__none') ? State.suppliers[supplierId] : null;
  const toEmail = supplier ? supplier.email : CONFIG.REORDER_EMAIL;
  const supplierName = supplier ? supplier.name : 'Unassigned supplier';
  const contactName = supplier && supplier.contactPerson ? supplier.contactPerson : null;
  const ccEmail = supplier && supplier.ccEmail ? supplier.ccEmail : '';

  if(!toEmail || !CONFIG.EMAILJS_SERVICE_ID || !CONFIG.EMAILJS_TEMPLATE_ID){
    toast('Reorder needed (' + supplierName + ') — email not sent, check EmailJS/supplier email setup', 'err');
    return;
  }
  const lines = items.map((i,idx)=> i.isVolume
    ? `${idx+1}. ${i.itemLabel}: ${mlToLabel(i.currentQty)} on hand (reorder at ${mlToLabel(i.reorderQty)})`
    : `${idx+1}. ${i.itemLabel}: ${i.currentQty} on hand (reorder at ${i.reorderQty})`
  ).join('\n');
  const greeting = 'Good day' + (contactName ? ' ' + contactName : '') + ',';
  // Numbered list + ending at "Kind regards," (no name) to match the
  // signature card the user pasted directly into the EmailJS template
  // itself — that's fixed HTML in the template now, not text this app
  // builds, so it shows up the same regardless of who triggered the send.
  const message = `${greeting}\n\nI hope this email finds you well.\n\nPlease quote me on the following:\n\n${lines}\n\nKind regards,`;
  emailjs.send(CONFIG.EMAILJS_SERVICE_ID, CONFIG.EMAILJS_TEMPLATE_ID, {
    to_email: toEmail,
    cc_email: ccEmail,
    from_name: (State.currentUser && State.currentUser.username) || 'Oak Joinery',
    item_name: supplierName + ' — ' + items.length + ' item(s)',
    current_qty: '',
    reorder_qty: '',
    message: message
  }).then(()=> toast('Reorder email sent to ' + supplierName, 'ok'))
    .catch(err => toast('Reorder email failed (' + supplierName + '): ' + (err.text||err.message||err), 'err'));
}

// Manual "send now" for a supplier, from the Suppliers tab — bypasses the queue/debounce.
function sendReorderEmailNowForSupplier(supplierId){
  const lowScrews = Object.values(State.screwItems||{}).filter(i=> totalScrewQty(i) <= i.reorderQty && (i.supplierId||'__none') === supplierId)
    .map(i=>({ itemLabel: i.size, currentQty: totalScrewQty(i), reorderQty: i.reorderQty }));
  const lowCons = Object.entries(State.consumableTypes||{}).filter(([tid,t])=>
    isConsumableTypeLow(tid, t) && (t.supplierId||'__none') === supplierId
  ).map(([tid,t])=> ({ itemLabel: t.name, currentQty: consumableTypeQty(tid,t), reorderQty: consumableTypeReorderLevel(t), isVolume: t.category==='liquid' }));
  const items = [...lowScrews, ...lowCons];
  if(items.length === 0){ toast('Nothing from this supplier currently needs reordering', 'err'); return; }
  sendSupplierReorderEmail(supplierId, items);
}

/* =========================================================================
   RENDER — top level router
   ========================================================================= */
function render(){
  const app = document.getElementById('app');
  if(!State.db){ return; } // still connecting
  // Root/login comes from the SHARED roster (dispatchBoard/users), not
  // this app's own data — an empty roster means nobody has set up ANY
  // of the four apps yet, not just this one.
  if(State.sharedUsers.length === 0){ app.innerHTML=''; app.appendChild(renderCreateRootAccount()); return; }
  if(!State.currentUser){ tryRestoreSession(); }
  if(!State.currentUser){ app.innerHTML = ''; app.appendChild(renderLogin()); return; }

  app.innerHTML = '';
  app.appendChild(renderTopbar());
  app.appendChild(renderTabs());

  const main = document.createElement('main');
  if(State.activeTab === 'screws') main.appendChild(renderScrewsTab());
  else if(State.activeTab === 'consumables') main.appendChild(renderConsumablesTab());
  else if(State.activeTab === 'people') main.appendChild(renderPeopleTab());
  else if(State.activeTab === 'reports') main.appendChild(renderReportsTab());
  else if(State.activeTab === 'suppliers') main.appendChild(renderSuppliersTab());
  else if(State.activeTab === 'dispatch') main.appendChild(renderSendToDispatchTab());
  else if(State.activeTab === 'admin') main.appendChild(renderAdminTab());
  app.appendChild(main);
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- Consumables Tab (thinners / terps / wood stopping) ---------- */
// Liquid consumables (added 2026-09-22, per user request: "change the
// liquid to 750ml each time it gets used... restock level of 20L") —
// tracked by total volume instead of discrete Full/3/4/1/2/1/4
// containers, since a shared drum of thinners/glue doesn't split into
// neat container units the way individually-bought tins do. Same
// location-sectioning as everything else in this app.
const DEFAULT_USE_ML = 750;
function totalVolumeMl(type){
  return Object.values(type.volumeByLocation || {}).reduce((a,b)=>a+(Number(b)||0), 0);
}
function volumeAt(type, location){
  return (type.volumeByLocation && type.volumeByLocation[location]) || 0;
}
function mlToLabel(ml){
  return ml >= 1000 ? (ml/1000).toFixed(ml % 1000 === 0 ? 0 : 1) + ' L' : ml + ' ml';
}
// Single source of truth for "is this consumable type low on stock" —
// branches on category since liquid uses total volume (ml) and
// everything else uses active-container count. Used everywhere a low-
// stock check on a consumableType happens, so the liquid switch didn't
// need touching every call site by hand.
function consumableTypeQty(tid, type){
  return type.category === 'liquid'
    ? totalVolumeMl(type)
    : Object.values(State.consumableUnits||{}).filter(u=>u.typeId===tid && u.fillLevel!=='Finished').length;
}
function consumableTypeReorderLevel(type){
  return type.category === 'liquid' ? (type.reorderLevelMl||0) : (type.reorderQty||0);
}
function isConsumableTypeLow(tid, type){
  return consumableTypeQty(tid, type) <= consumableTypeReorderLevel(type);
}
function renderLiquidCard(tid, type){
  const locations = (State.locations && State.locations.length) ? State.locations : ['Main'];
  const totalMl = totalVolumeMl(type);
  const reorderMl = type.reorderLevelMl || 0;
  const low = totalMl <= reorderMl;
  const supplierName = type.supplierId && State.suppliers[type.supplierId] ? State.suppliers[type.supplierId].name : null;

  const card = el('div','card');
  const head = el('div','');
  head.innerHTML = `

  `;

  table.innerHTML = `<thead><tr><th>Location</th><th>On hand</th></tr></thead>`;

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  card.appendChild(table);

  const row = el('div','btn-row');

    row.appendChild(smallBtn('Use ' + DEFAULT_USE_ML + 'ml', ()=> openUseLiquidModal(tid)));

function openUseLiquidModal(tid){
  const type = State.consumableTypes[tid];
  const locations = (State.locations && State.locations.length) ? State.locations : ['Main'];
  const people = Object.entries(State.people || {}).sort((a,b)=> a[1].name.localeCompare(b[1].name));
  const peopleOpts = people.map(([pid,p])=> `<option value="${pid}">${escapeHtml(p.name)}</option>`).join('');
  openModal('Use ' + type.name, `
    <label>Person</label>
    <select id="m-person">
      <option value="__new">+ New person…</option>
      ${peopleOpts}
    </select>
    <div id="m-newname-wrap" style="display:none">
      <label>New person's name</label>
      <input type="text" id="m-newname">
    </div>
    ${locationSelectHtml('m-loc', null)}
    <div class="row2">
      <div><label>Amount used (ml)</label><input type="number" id="m-ml" value="${DEFAULT_USE_ML}" min="1" step="50"></div>
      <div><label>Date</label><input type="date" id="m-date" value="${todayStr()}"></div>
    </div>
    <div class="sub" style="margin-top:8px">Total on hand: ${mlToLabel(totalVolumeMl(type))}</div>
  `, ()=>{
    const ml = parseInt(document.getElementById('m-ml').value) || 0;
    const date = document.getElementById('m-date').value || todayStr();
    const location = document.getElementById('m-loc').value;
    let personSel = document.getElementById('m-person').value;
    if(ml <= 0){ toast('Enter a positive amount', 'err'); return false; }
    const here = volumeAt(type, location);
    if(ml > here){ if(!confirm('That is more than the ' + mlToLabel(here) + ' on hand at ' + location + '. Continue anyway?')) return false; }

    const finishPersonId = (personId)=>{
      if(!type.volumeByLocation) type.volumeByLocation = {};
      type.volumeByLocation[location] = here - ml;
      dbRef('consumableTypes/' + tid + '/volumeByLocation').set(type.volumeByLocation);
      checkReorder('consumable', tid, type.name, totalVolumeMl(type), type.reorderLevelMl, type.reorderSent, type.supplierId, true);
      dbRef('transactions/' + uid()).set({
        personId, itemType:'consumable', itemId:tid, itemLabel: type.name + ' (' + ml + 'ml)', qty: ml, date, month: monthKey(date)
      });
      toast('Logged ' + ml + 'ml of ' + type.name + ' used', 'ok');
    };

    if(personSel === '__new'){
      const newName = document.getElementById('m-newname').value.trim();
      if(!newName){ toast("Enter the new person's name", 'err'); return false; }
      const newId = uid();
      dbRef('people/' + newId).set({ name: newName });
      finishPersonId(newId);
    } else {
      finishPersonId(personSel);
    }
    return true;
  });
  setTimeout(()=>{
    const sel = document.getElementById('m-person');
    if(sel) sel.onchange = ()=>{
      document.getElementById('m-newname-wrap').style.display = sel.value === '__new' ? 'block' : 'none';
    };
  });
}

function openRestockLiquidModal(tid){
  const type = State.consumableTypes[tid];
  openModal('Restock ' + type.name, `
    <label>Amount to add (liters)</label>
    <input type="number" id="m-l" value="20" min="0.1" step="0.1">
    ${locationSelectHtml('m-loc', null)}
  `, ()=>{

    const location = document.getElementById('m-loc').value;

  });
}

function renderConsumablesTab(){
  const container = el('div','');
  const types = Object.entries(State.consumableTypes || {}).sort((a,b)=> a[1].name.localeCompare(b[1].name));

  types.forEach(([tid, type])=>{
    if(type.category === 'liquid'){
      container.appendChild(renderLiquidCard(tid, type));
      return;
    }
    const units = Object.entries(State.consumableUnits || {}).filter(([uidk,u])=> u.typeId === tid);
    const activeCount = units.filter(([uidk,u])=> u.fillLevel !== 'Finished').length;
    const low = activeCount <= type.reorderQty;
    const locations = (State.locations && State.locations.length) ? State.locations : ['Main'];

    const card = el('div','card');
    const head = el('div','');
    const supplierName = type.supplierId && State.suppliers[type.supplierId] ? State.suppliers[type.supplierId].name : null;
    head.innerHTML = `
      <h2>${escapeHtml(type.name)} ${type.category==='liquid' ? '<span class="pill" style="margin-left:8px;background:#2b4a5e;color:#bfe0f5;">💧 Liquid</span>' : ''} ${low ? '<span class="pill low" style="margin-left:8px">Reorder</span>' : '<span class="pill ok" style="margin-left:8px">OK</span>'}</h2>
      <div class="sub">${activeCount} active container(s) · reorder at ${type.reorderQty}${supplierName ? ' · supplier: ' + escapeHtml(supplierName) : ''}</div>
    `;
    card.appendChild(head);

    if(units.length === 0){
      card.appendChild(elHtml('div','empty','No containers logged yet.'));
    } else {
      // Grouped by location, per user request ("i want the same in
      // consumables" — mirrors board-stock-app's location sections).
      // Every unit already has its OWN location field going forward;
      // any unit created before this change has none, so it's shown
      // under the first location as a sensible default rather than
      // disappearing from view.
      const firstLoc = locations[0];
      locations.forEach(loc => {
        const here = units.filter(([uidk,u]) => (u.location || firstLoc) === loc);
        if(here.length === 0) return;
        const locHead = document.createElement('div');
        locHead.style.cssText = 'font-weight:600;margin:14px 0 6px;font-size:13px;color:var(--amber);';
        locHead.textContent = loc;
        card.appendChild(locHead);
        const table = document.createElement('table');
        table.innerHTML = `<thead><tr><th>Container</th><th>Started</th><th>Fill level</th></tr></thead>`;
        const tbody = document.createElement('tbody');
        here.sort((a,b)=> (a[1].createdDate||'').localeCompare(b[1].createdDate||''));
        here.forEach(([unitId, unit])=>{
          const idx = units.findIndex(([k])=>k===unitId);
          const tr = document.createElement('tr');
          const nameTd = document.createElement('td');
          nameTd.textContent = type.name + ' #' + (idx+1);
          const dateTd = document.createElement('td');
          dateTd.textContent = unit.createdDate || '—';
          const fillTd = document.createElement('td');
          const toggle = el('div','fill-toggle');
          FILL_LEVELS.forEach(level=>{
            const opt = document.createElement('button');
            opt.className = 'fill-opt' + (unit.fillLevel===level ? ' active' + (level==='Finished' ? ' finished':'') : '');
            opt.textContent = level;
            opt.onclick = ()=>{
              dbRef('consumableUnits/' + unitId + '/fillLevel').set(level);
              setTimeout(()=>{
                const freshUnits = Object.entries(State.consumableUnits||{}).filter(([k,u])=>u.typeId===tid);
                const freshActive = freshUnits.filter(([k,u])=>u.fillLevel!=='Finished').length;
                checkReorder('consumable', tid, type.name, freshActive, type.reorderQty, type.reorderSent, type.supplierId);
              }, 150);
            };
            toggle.appendChild(opt);
          });
          fillTd.appendChild(toggle);
          tr.appendChild(nameTd); tr.appendChild(dateTd); tr.appendChild(fillTd);
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        card.appendChild(table);
      });
    }

    if(can('consManageConsumables')){
      const row = el('div','btn-row');
      row.style.cssText = 'align-items:center;gap:8px;';
      const locSel = document.createElement('select');
      locSel.style.cssText = 'width:auto;';
      locations.forEach(l => { const o = document.createElement('option'); o.value = l; o.textContent = l; locSel.appendChild(o); });
      row.appendChild(locSel);
      const addUnitBtn = document.createElement('button');
      addUnitBtn.className = 'btn btn-sm btn-ghost';
      addUnitBtn.textContent = '+ New container';
      addUnitBtn.onclick = ()=>{
        dbRef('consumableUnits/' + uid()).set({ typeId: tid, fillLevel:'Full', createdDate: todayStr(), location: locSel.value });
        setTimeout(()=>{
          const freshUnits = Object.entries(State.consumableUnits||{}).filter(([k,u])=>u.typeId===tid);
          const freshActive = freshUnits.filter(([k,u])=>u.fillLevel!=='Finished').length;
          checkReorder('consumable', tid, type.name, freshActive, type.reorderQty, type.reorderSent, type.supplierId);
        }, 150);
      };
      row.appendChild(addUnitBtn);

      if(can('consManageItems')){
        const editBtn = document.createElement('button');
        editBtn.className = 'btn btn-sm btn-ghost';
        editBtn.textContent = 'Edit type / reorder qty';
        editBtn.onclick = ()=> openEditConsumableTypeModal(tid);
        row.appendChild(editBtn);
      }
      card.appendChild(row);
    }

    container.appendChild(card);
  });

  if(can('consManageItems')){
    const addCard = el('div','card');
    addCard.innerHTML = `<h2>Add a new item type</h2><div class="sub">For thinners, terps, wood stopping on rags, or anything else tracked by container fill level.</div>`;
    const addRow = el('div','btn-row');
    const addBtn = document.createElement('button');
    addBtn.className = 'btn btn-amber';
    addBtn.textContent = '+ Add item type';
    addBtn.onclick = openAddConsumableTypeModal;
    addRow.appendChild(addBtn);
    addCard.appendChild(addRow);
    container.appendChild(addCard);
  }

  if(types.length === 0 && !can('consManageItems')){
    container.appendChild(elHtml('div','empty','No item types set up yet.'));
  }

  return container;
}

function categorySelectHtml(id, selected){
  // "Liquid" added per user request ("i want a liquid button so that if
  // or in case thinners work in 1/4 sections glue works the same") —
  // the fill-level tracking (Full/3/4/1/2/1/4/Finished) already applies
  // to every consumable type regardless of category; this just labels
  // liquid items (thinners, glue, etc.) consistently so they show the
  // same 💧 tag wherever they appear.
  const CATEGORIES = [['liquid','💧 Liquid (thinners, glue, etc.)'], ['stopping','Wood stopping'], ['other','Other']];
  return `<label>Category</label><select id="${id}">${CATEGORIES.map(([v,l])=>`<option value="${v}" ${v===selected?'selected':''}>${l}</option>`).join('')}</select>`;
}

function openEditConsumableTypeModal(tid){
  const type = State.consumableTypes[tid];
  const isLiquid = type.category === 'liquid';
  openModal('Edit ' + type.name, `
    <label>Name</label>
    <input type="text" id="m-name" value="${escapeHtml(type.name)}">
    ${categorySelectHtml('m-category', type.category || 'liquid')}
    <div id="m-reorder-container">
      <label id="m-reorder-label">${isLiquid ? 'Reorder level (liters)' : 'Reorder at (active containers)'}</label>
      <input type="number" id="m-reorder" value="${isLiquid ? (type.reorderLevelMl||0)/1000 : type.reorderQty}" step="${isLiquid?'0.1':'1'}">
    </div>
    ${supplierSelectHtml('m-supplier', type.supplierId)}
    <div class="btn-row"><button class="btn btn-danger" id="m-delete" type="button">Delete this item type</button></div>
  `, ()=>{
    const name = document.getElementById('m-name').value.trim();
    const category = document.getElementById('m-category').value;
    const reorderVal = parseFloat(document.getElementById('m-reorder').value) || 0;
    const supplierId = document.getElementById('m-supplier').value || null;
    if(!name){ toast('Enter a name', 'err'); return false; }
    if(category === 'liquid'){
      dbRef('consumableTypes/' + tid).update({ name, category, supplierId, reorderLevelMl: Math.round(reorderVal*1000), volumeByLocation: type.volumeByLocation || {} });
      checkReorder('consumable', tid, name, totalVolumeMl(type), Math.round(reorderVal*1000), type.reorderSent, supplierId, true);
    } else {
      dbRef('consumableTypes/' + tid).update({ name, category, supplierId, reorderQty: Math.round(reorderVal) });
      checkReorder('consumable', tid, name, (Object.values(State.consumableUnits||{}).filter(u=>u.typeId===tid && u.fillLevel!=='Finished').length), Math.round(reorderVal), type.reorderSent, supplierId);
    }
    return true;
  });
  setTimeout(()=>{
    const del = document.getElementById('m-delete');
    if(del) del.onclick = ()=>{
      if(confirm('Delete ' + type.name + ' and all its containers?')){
        dbRef('consumableTypes/' + tid).remove();
        Object.entries(State.consumableUnits||{}).filter(([k,u])=>u.typeId===tid).forEach(([k])=> dbRef('consumableUnits/'+k).remove());
        closeModal();
      }
    };
    const catSel = document.getElementById('m-category');
    if(catSel) catSel.onchange = ()=>{
      const nowLiquid = catSel.value === 'liquid';
      document.getElementById('m-reorder-label').textContent = nowLiquid ? 'Reorder level (liters)' : 'Reorder at (active containers)';
      document.getElementById('m-reorder').step = nowLiquid ? '0.1' : '1';
    };
  });
}

function renderPeopleTab(){
  const container = el('div','');
  const people = Object.entries(State.people || {}).sort((a,b)=> a[1].name.localeCompare(b[1].name));

  if(people.length === 0){
    const card = el('div','card');
    card.appendChild(elHtml('div','empty','No people added yet. People are added automatically the first time you hand something out to them.'));
    container.appendChild(card);
  }

  people.forEach(([pid, person])=>{
    const txns = Object.entries(State.transactions || {}).filter(([tid,t])=> t.personId === pid);
    const byMonth = {};
    txns.forEach(([tid,t])=>{
      byMonth[t.month] = byMonth[t.month] || [];
      byMonth[t.month].push(t);
    });
    const months = Object.keys(byMonth).sort().reverse();

    const card = el('div','card');
    const head = el('div','');
    head.innerHTML = `<h2>${escapeHtml(person.name)}</h2><div class="sub">${txns.length} item(s) taken all-time</div>`;
    card.appendChild(head);

    if(months.length === 0){
      card.appendChild(elHtml('div','empty','No items handed out to this person yet.'));
    } else {
      months.forEach(mk=>{
        const list = byMonth[mk];
        const total = list.reduce((s,t)=> s + t.qty, 0);
        const details = document.createElement('details');
        details.className = 'person-month';
        const summary = document.createElement('summary');
        summary.innerHTML = `<span>${monthLabel(mk)}</span><span class="total">${total} item(s)</span>`;
        details.appendChild(summary);
        const body = el('div','body');
        const table = document.createElement('table');
        table.innerHTML = `<thead><tr><th>Date</th><th>Item</th><th>Qty</th></tr></thead>`;
        const tbody = document.createElement('tbody');
        list.sort((a,b)=> a.date.localeCompare(b.date)).forEach(t=>{
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${t.date}</td><td>${escapeHtml(t.itemLabel)}</td><td class="num">${t.qty}</td>`;
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        body.appendChild(table);
        details.appendChild(body);
        card.appendChild(details);
      });

    if(can('consManageItems')){

        }
      });
      row.appendChild(delBtn);
      card.appendChild(row);
    }

    container.appendChild(card);
  });

  return container;

/* Stock report PDF (added 2026-09-23, per user request: "is it setup to
   pull stock levels...to hand in to my superiors" — mirrors Stock List's
   own Print/Share PDF). Two tables: screws, then consumable types
   (liquid volumes and container counts both shown in their own units). */
function buildStockPdfBlob(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const locations = (State.locations && State.locations.length) ? State.locations : ['Main'];

  doc.setFontSize(16);
  doc.setFont(undefined, 'bold');
  doc.text('Fixings & Finishing Stock Report', 14, 18);
  doc.setFontSize(9);
  doc.setFont(undefined, 'normal');
  doc.text('Generated ' + new Date().toLocaleString(), 14, 24);

  let y = 32;
  const screws = Object.values(State.screwItems || {}).sort((a,b)=> a.size.localeCompare(b.size, undefined, {numeric:true}));
  if(screws.length > 0){
    const rows = screws.map(item => {
      const breakdown = locations.map(l => `${l}: ${screwQtyAt(item,l)}`).join('  ·  ');
      return [item.size, item.bundleSize, breakdown, totalScrewQty(item), item.reorderQty];
    });
    doc.autoTable({
      startY: y,
      head: [['Screws', 'Bundle size', 'By location', 'Total (bundles)', 'Reorder at']],
      body: rows,
      styles: { fontSize: 8, cellPadding: 2 },
      headStyles: { fillColor: [184, 121, 31] },
      margin: { left: 14, right: 14 },
    });
    y = doc.lastAutoTable.finalY + 8;
  }

  const types = Object.entries(State.consumableTypes || {}).sort((a,b)=> a[1].name.localeCompare(b[1].name));
  if(types.length > 0){
    const rows = types.map(([tid, type]) => {
      if(type.category === 'liquid'){
        const breakdown = locations.map(l => `${l}: ${mlToLabel(volumeAt(type,l))}`).join('  ·  ');
        return [type.name + ' (Liquid)', breakdown, mlToLabel(totalVolumeMl(type)), mlToLabel(type.reorderLevelMl||0)];
      }
      const active = Object.values(State.consumableUnits||{}).filter(u=>u.typeId===tid && u.fillLevel!=='Finished').length;
      return [type.name, '—', active + ' container(s)', (type.reorderQty||0) + ' container(s)'];
    });
    if(y > 250){ doc.addPage(); y = 20; }
    doc.autoTable({
      startY: y,
      head: [['Consumable', 'By location', 'Total on hand', 'Reorder at']],
      body: rows,
      styles: { fontSize: 8, cellPadding: 2 },
      headStyles: { fillColor: [184, 121, 31] },
      margin: { left: 14, right: 14 },
    });
  }

  return doc.output('blob');
}
async function generateAndShareStockPdf(){

  const btn = document.getElementById('share-stock-pdf-btn');
  const original = btn.textContent;

  btn.textContent = 'Preparing PDF…';
  try{
    const blob = buildStockPdfBlob();
    const file = new File([blob], 'consumables-stock-report.pdf', { type: 'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: 'Consumables Stock Report', text: 'Consumables stock report — ' + new Date().toLocaleDateString() });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'consumables-stock-report.pdf';
      document.body.appendChild(a); a.click();

async function submitSendToDispatch(){
  if(!can('consSendToDispatch')) return;
  const kind = document.getElementById('sd-kind').value;
  const itemId = document.getElementById('sd-item').value;
  const location = document.getElementById('sd-loc').value;
  const qty = parseInt(document.getElementById('sd-qty').value, 10);
  const ref = document.getElementById('sd-ref').value.trim();
  if(!itemId){ toast('Choose an item first', 'err'); return; }
  if(!qty || qty <= 0){ toast('Enter a valid quantity', 'err'); return; }
  if(!State.dispatchBoardRef){ toast('Not connected to the Dispatch app yet — try again in a moment.', 'err'); return; }

  let label, here, deductRef, deductObjKey;
  if(kind === 'screw'){
    const item = State.screwItems[itemId];
    if(!item){ toast('That screw size no longer exists', 'err'); return; }
    label = item.size;
    here = screwQtyAt(item, location);
    if(qty > here && !confirm(`Only ${here} bundle(s) on hand at ${location} — send anyway? Stock will show as negative there.`)) return;
    if(!item.qtyByLocation) item.qtyByLocation = {};
    item.qtyByLocation[location] = here - qty;
    await dbRef('screwItems/' + itemId + '/qtyByLocation').set(item.qtyByLocation);
    checkReorder('screw', itemId, label, totalScrewQty(item), item.reorderQty, item.reorderSent, item.supplierId);
  } else {
    const type = State.consumableTypes[itemId];
    if(!type){ toast('That liquid no longer exists', 'err'); return; }
    label = type.name;
    here = volumeAt(type, location);
    if(qty > here && !confirm(`Only ${mlToLabel(here)} on hand at ${location} — send anyway? Stock will show as negative there.`)) return;
    if(!type.volumeByLocation) type.volumeByLocation = {};
    type.volumeByLocation[location] = here - qty;
    await dbRef('consumableTypes/' + itemId + '/volumeByLocation').set(type.volumeByLocation);
    checkReorder('consumable', itemId, label, totalVolumeMl(type), type.reorderLevelMl, type.reorderSent, type.supplierId, true);
  }

  try{
    const snap = await State.dispatchBoardRef.child('items').once('value');
    const items = Array.isArray(snap.val()) ? snap.val() : [];
    const today = new Date().toLocaleDateString('en-GB', {day:'2-digit', month:'long', year:'numeric'});
    items.push({
      id: uid(), type: label + (kind==='liquid' ? ' (' + qty + 'ml)' : ''), qty, ref,
      status: 'unvinaged',
      addedDate: today, vinagedDate: null, readyDate: null, dispatchedDate: null, noteId: null,
      recipeSnapshot: [{ sourceApp: 'consumablesStock', kind, itemId, desc: label, deductQty: qty, location }]
    });
    await State.dispatchBoardRef.child('items').set(items);
    toast(`Sent ${qty}${kind==='liquid'?'ml':''} of ${label} to Dispatch.`, 'ok');
    document.getElementById('sd-qty').value = '1';
    document.getElementById('sd-ref').value = '';
  } catch(e){
    toast('Could not reach the Dispatch app — check your connection and try again.', 'err');
  }
}

    };
    const apps = readAppAccessChecklist('nu', iAmMainRoot, null);
    State.sharedUsers.push({ id: uid(), username, pin: await hashPin(pin), consEmailSignature: signature, isRoot, permissions, apps });
    await saveSharedUsers();
    return true;
  });
}

function openEditUserModal(id){
  const u = State.sharedUsers.find(x=>x.id===id);
  if(!u) return;
  if(isMainRoot(u) && !currentUserIsMainRoot()){ toast('Only the main root account can edit itself.', 'err'); return; }
  const iAmMainRoot = currentUserIsMainRoot();
  const perms = u.permissions || DEFAULT_PERMS;
  const apps = u.apps || defaultApps();
  openModal('Edit ' + u.username, `
    <label>Username</label>
    <input type="text" id="m-username" value="${escapeHtml(u.username)}">
    <label>PIN</label>
    <input type="text" id="m-pin" placeholder="Leave blank to keep current PIN">
    <label>Email signature (pasted from your Outlook signature — used to sign reorder emails)</label>
    <textarea id="m-signature" rows="4" style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:7px;font-size:14px;font-family:var(--sans);">${escapeHtml(u.consEmailSignature||'')}</textarea>
    ${isMainRoot(u) ? '' : `<label><input type="checkbox" id="m-isroot" ${u.isRoot?'checked':''} style="width:auto;display:inline-block;margin-right:6px"> Root user</label>`}
    ${appAccessChecklistHtml('eu', apps, iAmMainRoot)}
    <label style="margin-top:8px;">What can they do in this app?</label>
    <div class="checklist">
      <label><input type="checkbox" id="p-consHandOut" ${perms.consHandOut?'checked':''}> Hand out items</label>
      <label><input type="checkbox" id="p-consManageConsumables" ${perms.consManageConsumables?'checked':''}> Update container fill levels</label>
      <label><input type="checkbox" id="p-consManageItems" ${perms.consManageItems?'checked':''}> Add/edit items &amp; reorder levels</label>
      <label><input type="checkbox" id="p-consViewReports" ${perms.consViewReports?'checked':''}> View reports</label>
      <label><input type="checkbox" id="p-consExportExcel" ${perms.consExportExcel?'checked':''}> Export to Excel</label>
      <label><input type="checkbox" id="p-consSendToDispatch" ${perms.consSendToDispatch?'checked':''}> Send to Dispatch</label>
    </div>
    ${isMainRoot(u) ? '' : `<div class="btn-row"><button class="btn btn-danger" id="m-delete" type="button">Delete this user</button></div>`}
  `, async ()=>{
    if(isMainRoot(u) && !currentUserIsMainRoot()) return false; // belt and braces
    const username = document.getElementById('m-username').value.trim();
    const pin = document.getElementById('m-pin').value;
    const signature = document.getElementById('m-signature').value.trim();
    const isRootBox = document.getElementById('m-isroot');
    if(!username){ toast('Enter a username', 'err'); return false; }
    const newPerms = {
      consHandOut: document.getElementById('p-consHandOut').checked,
      consManageConsumables: document.getElementById('p-consManageConsumables').checked,
      consManageItems: document.getElementById('p-consManageItems').checked,
      consViewReports: document.getElementById('p-consViewReports').checked,
      consExportExcel: document.getElementById('p-consExportExcel').checked,
      consSendToDispatch: document.getElementById('p-consSendToDispatch').checked,
      manageUsers: (u.permissions && u.permissions.manageUsers) || false
    };
    u.username = username;
    if(pin) u.pin = await hashPin(pin);
    u.consEmailSignature = signature;
    u.permissions = newPerms;
    u.isRoot = isMainRoot(u) ? true : (isRootBox ? isRootBox.checked : u.isRoot);
    u.apps = isMainRoot(u) ? defaultApps() : readAppAccessChecklist('eu', iAmMainRoot, apps);
    await saveSharedUsers();
    return true;
  });
  setTimeout(()=>{
    const del = document.getElementById('m-delete');
    if(del) del.onclick = async ()=>{
      if(id === State.currentUser.id){ toast("You can't delete the account you're logged in as", 'err'); return; }
      if(u.isRoot && State.sharedUsers.filter(x=>x.isRoot).length <= 1){ toast("You can't delete the only root account — make another user root first", 'err'); return; }
      if(confirm('Remove user ' + u.username + '? They will no longer be able to log in to any app.')){
        State.sharedUsers = State.sharedUsers.filter(x=>x.id!==id);
        await saveSharedUsers();
        closeModal();
      }
    };
  });
}

/* ---------- Modal helper ---------- */
function openModal(title, bodyHtml, onSave){
  closeModal();
  const bg = el('div','modal-bg');
  bg.id = 'active-modal';
  const modal = el('div','modal');
  modal.innerHTML = `<button class="modal-close" id="modal-x">&times;</button><h3>${title}</h3><div id="modal-body">${bodyHtml}</div><div class="btn-row"><button class="btn btn-amber" id="modal-save">Save</button><button class="btn btn-ghost" id="modal-cancel">Cancel</button></div>`;
  bg.appendChild(modal);
  document.body.appendChild(bg);
  document.getElementById('modal-x').onclick = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-save').onclick = ()=>{
    const ok = onSave();
    if(ok !== false) closeModal();
  };
  bg.addEventListener('click', e=>{ if(e.target === bg) closeModal(); });
}
function closeModal(){
  const m = document.getElementById('active-modal');
  if(m) m.remove();
}
