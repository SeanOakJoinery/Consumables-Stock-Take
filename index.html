<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Fixings &amp; Finishing Stock</title>

<!--
  CLAUDE DEV NOTES (keep this updated across sessions)
  =====================================================
  App: Screws / Thinners / Wood Stopping stock tracker for Oak Joinery (Pty) Ltd.
  Third app in the family, alongside board-stock-app and oak-joinery-stock-board.
  Own separate Firebase Realtime Database project (do not share with the other two apps).

  DATA MODEL (Firebase Realtime Database, root path configurable via CONFIG.DB_PATH):
    /users/{userId}        -> { username, pin, isRoot, perms:{manageUsers,manageItems,handOut,manageConsumables,viewReports,exportExcel} }
    /screwItems/{id}       -> { size, bundleSize, qtyBundles, reorderQty, reorderSent(bool) }
    /consumableTypes/{id}  -> { name, category ('thinner'|'stopping'|'other'), reorderQty, reorderSent(bool) }
    /consumableUnits/{id}  -> { typeId, fillLevel ('Full'|'3/4'|'1/2'|'1/4'|'Finished'), createdDate }
    /people/{id}           -> { name }
    /transactions/{id}     -> { personId, itemType('screw'|'consumable'), itemId, itemLabel, qty, date (YYYY-MM-DD), month (YYYY-MM) }
    /suppliers/{id}        -> { name, email }
    /emailConfig           -> { serviceId, templateId, publicKey, reorderEmail } (root-only, baked once via setup screen)

  Screws and consumable types both carry a `supplierId` (nullable) set from a dropdown on their
  add/edit modals. Reorder emails are bundled per supplier: when an item crosses its reorder
  threshold it's queued (see reorderQueue / enqueueReorder), and after a short debounce
  (flushReorderQueue, ~3s) one email per supplier goes out listing every item from them that
  needs reordering, sent to that supplier's own email (falls back to CONFIG.REORDER_EMAIL if no
  supplier is set), CC'd to the supplier's ccEmail if set. Body: "Good day {contact person}," /
  "I hope this email finds you well." / "Please quote me on the following:" / itemised list /
  "Kind regards," + the signature of whichever logged-in user's action triggered the reorder
  (users/{id}/signature, falls back to their username). The Suppliers tab also has a manual
  "Send reorder email now" per supplier that bypasses the queue for testing/ad-hoc use.

  AUTH: username + 4-digit PIN, stored in DB (not Firebase Auth). Root user manages other users +
  per-tab permissions, same pattern as board-stock-app. Root config (Firebase project keys +
  EmailJS keys) is entered once via the Setup screen and stored in localStorage on that device
  (mirrors board-stock-app's approach: keys are not pushed to the DB itself, only emailConfig
  routing fields are, since anyone with DB read access could see them otherwise... actually see
  CONFIG block below, Firebase config IS baked into the file at deploy time by root, simplest &
  matches the other two apps).

  REORDER LOGIC: on every qty change, check item's qty/active-unit-count against reorderQty.
  If at/below threshold and reorderSent is false -> send EmailJS alert, set reorderSent=true.
  If restocked back above threshold -> reset reorderSent=false so a future dip alerts again.

  EXCEL EXPORT: SheetJS (xlsx), client-side, per-person monthly transaction history.

  STATUS: initial build, not yet deployed. Root needs to create a Firebase project + Realtime
  Database and paste the config into FIREBASE_CONFIG below (see SETUP.md), same as board-stock-app.
-->

<style>

    background:var(--panel);position:sticky;top:0;z-index:20;
  }
  .topbar .brand{display:flex;align-items:baseline;gap:10px;}

  .btn{background:var(--panel-raised);border:1px solid var(--line);color:var(--text);padding:7px 13px;border-radius:7px;font-size:13px;}

  .btn-ghost{background:none;border:1px solid var(--line);color:var(--text-dim);}
  .btn-danger{background:none;border:1px solid var(--red);color:var(--red);}
  .btn-sm{padding:4px 9px;font-size:12px;border-radius:6px;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

  label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:4px;margin-top:10px;}
  input[type=text],input[type=number],input[type=password],input[type=date],select{
    width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
    padding:8px 10px;border-radius:7px;font-size:14px;
  }

  .fill-toggle{display:flex;gap:6px;flex-wrap:wrap;}

    border:1px solid var(--line);background:var(--bg);color:var(--text-dim);

  }
  .fill-opt.active{background:var(--amber);border-color:var(--amber);color:#1a1a1a;font-weight:700;}

  .empty{color:var(--text-dim);font-size:13px;padding:14px 0;text-align:center;}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{width:100%;max-width:340px;}
  .login-box h1{font-size:20px;text-align:center;margin-bottom:2px;}
  .login-box .sub{text-align:center;color:var(--text-dim);font-size:13px;margin-bottom:20px;}
  .err{color:var(--red);font-size:12.5px;margin-top:8px;min-height:14px;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--panel-raised);border:1px solid var(--line);color:var(--text);
    padding:10px 18px;border-radius:8px;font-size:13px;z-index:100;box-shadow:0 4px 14px rgba(0,0,0,.4);

  .person-month summary .total{color:var(--amber);font-family:var(--mono);}
  .person-month .body{padding:4px 14px 10px 14px;}

  .setup-screen{max-width:520px;margin:40px auto;padding:0 20px;}

<body>

<div id="app"></div>
<div id="toast-holder"></div>

<script>
/* =========================================================================
   CONFIG — root fills this in once via the Setup screen (see SETUP.md).
   Baked into localStorage on first run so it doesn't need to live in the DB.
   ========================================================================= */
const DEFAULT_CONFIG = {
  FIREBASE_CONFIG: null, // { apiKey, authDomain, databaseURL, projectId, storageBucket, messagingSenderId, appId }
  DB_PATH: "fixingsStock",
  EMAILJS_PUBLIC_KEY: "",
  EMAILJS_SERVICE_ID: "",
  EMAILJS_TEMPLATE_ID: "",
  REORDER_EMAIL: ""
};

function loadConfig(){
  try{
    const raw = localStorage.getItem('fixingsStockConfig');
    if(raw) return {...DEFAULT_CONFIG, ...JSON.parse(raw)};
  }catch(e){}
  return {...DEFAULT_CONFIG};
}
function saveConfig(cfg){
  localStorage.setItem('fixingsStockConfig', JSON.stringify(cfg));
}
let CONFIG = loadConfig();

/* =========================================================================
   STATE
   ========================================================================= */
const State = {
  db: null,
  currentUser: null, // {id, username, isRoot, perms}
  users: {},
  screwItems: {},
  consumableTypes: {},
  consumableUnits: {},
  people: {},
  transactions: {},
  suppliers: {},
  activeTab: 'screws',
  ready: false
};

const FILL_LEVELS = ['Full','3/4','1/2','1/4','Finished'];
const DEFAULT_PERMS = { manageUsers:false, manageItems:false, handOut:true, manageConsumables:true, viewReports:true, exportExcel:true };

function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function monthKey(d){ return d.slice(0,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthLabel(mk){
  const [y,m] = mk.split('-');
  return new Date(y, m-1, 1).toLocaleString('default',{month:'long', year:'numeric'});
}

function toast(msg, type){
  const holder = document.getElementById('toast-holder');
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'');
  el.textContent = msg;
  holder.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

/* =========================================================================
   FIREBASE INIT + SYNC
   ========================================================================= */
function initFirebase(){
  if(!CONFIG.FIREBASE_CONFIG){ renderSetupScreen(); return; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(CONFIG.FIREBASE_CONFIG);
    State.db = firebase.database();
  }catch(e){
    toast('Firebase init failed: ' + e.message, 'err');
    renderSetupScreen();
    return;
  }
  attachListeners();
}

function attachListeners(){
  const base = State.db.ref(CONFIG.DB_PATH);
  base.child('users').on('value', snap => { State.users = snap.val() || {}; onDataChange(); });
  base.child('screwItems').on('value', snap => { State.screwItems = snap.val() || {}; onDataChange(); });
  base.child('consumableTypes').on('value', snap => { State.consumableTypes = snap.val() || {}; onDataChange(); });
  base.child('consumableUnits').on('value', snap => { State.consumableUnits = snap.val() || {}; onDataChange(); });
  base.child('people').on('value', snap => { State.people = snap.val() || {}; onDataChange(); });
  base.child('transactions').on('value', snap => { State.transactions = snap.val() || {}; onDataChange(); });
  base.child('suppliers').on('value', snap => { State.suppliers = snap.val() || {}; onDataChange(); });
  State.ready = true;
}

function dbRef(path){ return State.db.ref(CONFIG.DB_PATH + '/' + path); }

let renderQueued = false;
function onDataChange(){
  if(renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(()=>{ renderQueued = false; render(); });
}

/* =========================================================================
   AUTH
   ========================================================================= */
const SESSION_KEY = 'fixingsStockSession';

function attemptLogin(username, pin){
  const entry = Object.entries(State.users).find(([id,u]) => u.username.toLowerCase() === username.trim().toLowerCase());
  if(!entry) return 'No user with that username.';
  const [id, u] = entry;
  if(String(u.pin) !== String(pin).trim()) return 'Incorrect PIN.';
  State.currentUser = { id, username: u.username, isRoot: !!u.isRoot, perms: u.perms || DEFAULT_PERMS, signature: u.signature || '' };
  sessionStorage.setItem(SESSION_KEY, JSON.stringify({id}));
  render();
  return null;
}

function tryRestoreSession(){
  try{
    const raw = sessionStorage.getItem(SESSION_KEY);
    if(!raw) return;
    const {id} = JSON.parse(raw);
    const u = State.users[id];
    if(u) State.currentUser = { id, username: u.username, isRoot: !!u.isRoot, perms: u.perms || DEFAULT_PERMS, signature: u.signature || '' };
  }catch(e){}
}

function logout(){
  sessionStorage.removeItem(SESSION_KEY);
  State.currentUser = null;
  render();
}

function can(perm){
  if(!State.currentUser) return false;
  if(State.currentUser.isRoot) return true;
  return !!State.currentUser.perms[perm];
}

/* =========================================================================
   REORDER EMAIL — bundled per supplier
   ========================================================================= */
let reorderQueue = {}; // supplierId (or '__none') -> [{itemLabel, currentQty, reorderQty}]
let reorderFlushTimer = null;

function checkReorder(kind, id, label, currentQty, reorderQty, currentlySent, supplierId){
  const belowThreshold = currentQty <= reorderQty;
  const path = kind === 'screw' ? 'screwItems' : 'consumableTypes';
  if(belowThreshold && !currentlySent){
    enqueueReorder(supplierId, label, currentQty, reorderQty);
    dbRef(path + '/' + id + '/reorderSent').set(true);
  } else if(!belowThreshold && currentlySent){
    dbRef(path + '/' + id + '/reorderSent').set(false);
  }
}

function enqueueReorder(supplierId, itemLabel, currentQty, reorderQty){
  const key = supplierId || '__none';
  reorderQueue[key] = reorderQueue[key] || [];
  reorderQueue[key].push({ itemLabel, currentQty, reorderQty });
  if(reorderFlushTimer) clearTimeout(reorderFlushTimer);
  // short delay so several items dropping below threshold around the same time
  // (e.g. a batch of fill-level updates) land in one email per supplier
  reorderFlushTimer = setTimeout(flushReorderQueue, 3000);
}

function flushReorderQueue(){
  const queued = reorderQueue;
  reorderQueue = {};
  reorderFlushTimer = null;
  Object.entries(queued).forEach(([supplierId, items])=> sendSupplierReorderEmail(supplierId, items));
}

function sendSupplierReorderEmail(supplierId, items){
  const supplier = (supplierId && supplierId !== '__none') ? State.suppliers[supplierId] : null;
  const toEmail = supplier ? supplier.email : CONFIG.REORDER_EMAIL;
  const supplierName = supplier ? supplier.name : 'Unassigned supplier';
  const contactName = supplier && supplier.contactPerson ? supplier.contactPerson : null;
  const ccEmail = supplier && supplier.ccEmail ? supplier.ccEmail : '';

  if(!toEmail || !CONFIG.EMAILJS_SERVICE_ID || !CONFIG.EMAILJS_TEMPLATE_ID){
    toast('Reorder needed (' + supplierName + ') — email not sent, check EmailJS/supplier email setup', 'err');
    return;
  }
  const lines = items.map(i=> `${i.itemLabel}: ${i.currentQty} on hand (reorder at ${i.reorderQty})`).join('\n');
  const greeting = 'Good day' + (contactName ? ' ' + contactName : '') + ',';
  const signature = (State.currentUser && (State.currentUser.signature || State.currentUser.username)) || '';
  const signOff = signature ? `\n\nKind regards,\n${signature}` : '';
  const message = `${greeting}\n\nI hope this email finds you well.\n\nPlease quote me on the following:\n\n${lines}${signOff}`;
  emailjs.send(CONFIG.EMAILJS_SERVICE_ID, CONFIG.EMAILJS_TEMPLATE_ID, {
    to_email: toEmail,
    cc_email: ccEmail,
    from_name: signature,
    item_name: supplierName + ' — ' + items.length + ' item(s)',
    current_qty: '',
    reorder_qty: '',
    message: message
  }).then(()=> toast('Reorder email sent to ' + supplierName, 'ok'))
    .catch(err => toast('Reorder email failed (' + supplierName + '): ' + (err.text||err.message||err), 'err'));
}

// Manual "send now" for a supplier, from the Suppliers tab — bypasses the queue/debounce.
function sendReorderEmailNowForSupplier(supplierId){
  const lowScrews = Object.values(State.screwItems||{}).filter(i=> i.qtyBundles <= i.reorderQty && (i.supplierId||'__none') === supplierId)
    .map(i=>({ itemLabel: i.size, currentQty: i.qtyBundles, reorderQty: i.reorderQty }));
  const lowCons = Object.entries(State.consumableTypes||{}).filter(([tid,t])=>{
    const active = Object.values(State.consumableUnits||{}).filter(u=>u.typeId===tid && u.fillLevel!=='Finished').length;
    return active <= t.reorderQty && (t.supplierId||'__none') === supplierId;
  }).map(([tid,t])=>{
    const active = Object.values(State.consumableUnits||{}).filter(u=>u.typeId===tid && u.fillLevel!=='Finished').length;
    return { itemLabel: t.name, currentQty: active, reorderQty: t.reorderQty };
  });
  const items = [...lowScrews, ...lowCons];
  if(items.length === 0){ toast('Nothing from this supplier currently needs reordering', 'err'); return; }
  sendSupplierReorderEmail(supplierId, items);
}

/* =========================================================================
   RENDER — top level router
   ========================================================================= */
function render(){
  const app = document.getElementById('app');
  if(!State.db){ return; } // setup screen already showing
  if(!State.currentUser){ tryRestoreSession(); }
  if(!State.currentUser){ app.innerHTML = ''; app.appendChild(renderLogin()); return; }

  app.innerHTML = '';
  app.appendChild(renderTopbar());
  app.appendChild(renderTabs());

  const main = document.createElement('main');
  if(State.activeTab === 'screws') main.appendChild(renderScrewsTab());
  else if(State.activeTab === 'consumables') main.appendChild(renderConsumablesTab());
  else if(State.activeTab === 'people') main.appendChild(renderPeopleTab());
  else if(State.activeTab === 'reports') main.appendChild(renderReportsTab());
  else if(State.activeTab === 'suppliers') main.appendChild(renderSuppliersTab());
  else if(State.activeTab === 'admin') main.appendChild(renderAdminTab());
  app.appendChild(main);
}

/* ---------- Login ---------- */
function renderLogin(){
  const wrap = el('div','login-wrap');
  const box = el('div','login-box');
  box.innerHTML = `
    <h1>Fixings &amp; Finishing Stock</h1>
    <div class="sub">Oak Joinery — sign in</div>
    <label>Username</label>
    <input type="text" id="li-user" autocomplete="username">
    <label>PIN</label>
    <input type="password" id="li-pin" inputmode="numeric" autocomplete="current-password">
    <div class="btn-row"><button class="btn btn-amber" id="li-btn" style="width:100%">Sign in</button></div>
    <div class="err" id="li-err"></div>
  `;
  wrap.appendChild(box);
  setTimeout(()=>{
    const doLogin = ()=>{
      const u = document.getElementById('li-user').value;
      const p = document.getElementById('li-pin').value;
      const err = attemptLogin(u,p);
      document.getElementById('li-err').textContent = err || '';
    };
    document.getElementById('li-btn').onclick = doLogin;
    document.getElementById('li-pin').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  });
  return wrap;
}

/* ---------- Topbar / Tabs ---------- */
function renderTopbar(){
  const bar = el('div','topbar');
  bar.innerHTML = `
    <div class="brand"><span class="mark">OJ//STOCK</span><h1>Fixings &amp; Finishing</h1></div>
    <div class="who">
      <span>${State.currentUser.username}${State.currentUser.isRoot ? ' · root' : ''}</span>
      <button id="logout-btn">Sign out</button>
    </div>
  `;
  setTimeout(()=> document.getElementById('logout-btn').onclick = logout);
  return bar;
}

function renderTabs(){
  const tabs = el('div','tabs');
  const items = [
    ['screws','Screws'],
    ['consumables','Thinners & Stopping'],
    ['people','People'],
    ['reports','Reports & Export'],
    ['suppliers','Suppliers'],
  ];
  if(State.currentUser.isRoot || can('manageUsers')) items.push(['admin','Admin']);
  items.forEach(([key,label])=>{
    const b = document.createElement('button');
    b.className = 'tab-btn' + (State.activeTab===key ? ' active':'');
    b.textContent = label;
    b.onclick = ()=>{ State.activeTab = key; render(); };
    tabs.appendChild(b);
  });
  return tabs;
}

function el(tag, cls){ const e = document.createElement(tag); if(cls) e.className = cls; return e; }

/* ---------- Screws Tab ---------- */
function renderScrewsTab(){
  const wrap = document.createDocumentFragment ? el('div','') : el('div','');
  const items = Object.entries(State.screwItems || {}).sort((a,b)=> a[1].size.localeCompare(b[1].size, undefined, {numeric:true}));

  const card = el('div','card');
  const header = el('div','');
  header.innerHTML = `<h2>Screw stock</h2><div class="sub">Quantities are in bundles of 500 unless the item says otherwise.</div>`;
  card.appendChild(header);

  if(items.length === 0){
    card.appendChild(elHtml('div','empty','No screw sizes added yet.'));
  } else {
    const table = document.createElement('table');
    table.innerHTML = `<thead><tr><th>Size</th><th>Bundle size</th><th>On hand (bundles)</th><th>Reorder at</th><th>Supplier</th><th>Status</th><th></th></tr></thead>`;
    const tbody = document.createElement('tbody');
    items.forEach(([id,item])=>{
      const low = item.qtyBundles <= item.reorderQty;
      const supplierName = item.supplierId && State.suppliers[item.supplierId] ? State.suppliers[item.supplierId].name : '—';
      const tr = document.createElement('tr');
      if(low) tr.className = 'low-stock';
      tr.innerHTML = `
        <td>${escapeHtml(item.size)}</td>
        <td class="num">${item.bundleSize}</td>
        <td class="num">${item.qtyBundles}</td>
        <td class="num">${item.reorderQty}</td>
        <td>${escapeHtml(supplierName)}</td>
        <td>${low ? '<span class="pill low">Reorder</span>' : '<span class="pill ok">OK</span>'}</td>
        <td></td>
      `;
      const actionsTd = tr.lastElementChild;
      if(can('handOut')){
        const outBtn = smallBtn('Hand out', ()=> openHandOutModal('screw', id));
        actionsTd.appendChild(outBtn);
      }
      if(can('manageItems')){
        const restockBtn = smallBtn('Restock', ()=> openRestockModal('screw', id));
        restockBtn.style.marginLeft = '6px';
        actionsTd.appendChild(restockBtn);
        const editBtn = smallBtn('Edit', ()=> openEditScrewModal(id));
        editBtn.style.marginLeft = '6px';
        actionsTd.appendChild(editBtn);
      }
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    card.appendChild(table);
  }

  if(can('manageItems')){
    const row = el('div','btn-row');
    const addBtn = document.createElement('button');
    addBtn.className = 'btn btn-amber';
    addBtn.textContent = '+ Add screw size';
    addBtn.onclick = openAddScrewModal;
    row.appendChild(addBtn);
    card.appendChild(row);
  }

  const container = el('div','');
  container.appendChild(card);
  return container;
}

function smallBtn(label, onClick){
  const b = document.createElement('button');
  b.className = 'btn btn-sm btn-ghost';
  b.textContent = label;
  b.onclick = onClick;
  return b;
}
function elHtml(tag, cls, html){ const e = el(tag, cls); e.innerHTML = html; return e; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function supplierSelectHtml(id, selectedId){
  const suppliers = Object.entries(State.suppliers || {}).sort((a,b)=> a[1].name.localeCompare(b[1].name));
  const opts = suppliers.map(([sid,s])=> `<option value="${sid}" ${sid===selectedId ? 'selected':''}>${escapeHtml(s.name)}</option>`).join('');
  return `<label>Supplier</label><select id="${id}"><option value="">No supplier set</option>${opts}</select>`;
}

function openAddScrewModal(){
  openModal('Add screw size', `
    <label>Size (e.g. 6 x 16)</label>
    <input type="text" id="m-size">
    <div class="row2">
      <div><label>Bundle size</label><input type="number" id="m-bundle" value="500"></div>
      <div><label>Reorder at (bundles)</label><input type="number" id="m-reorder" value="2"></div>
    </div>
    <label>Starting qty (bundles)</label>
    <input type="number" id="m-qty" value="0">
    ${supplierSelectHtml('m-supplier', null)}
  `, ()=>{
    const size = document.getElementById('m-size').value.trim();
    const bundleSize = parseInt(document.getElementById('m-bundle').value) || 500;
    const reorderQty = parseInt(document.getElementById('m-reorder').value) || 0;
    const qtyBundles = parseInt(document.getElementById('m-qty').value) || 0;
    const supplierId = document.getElementById('m-supplier').value || null;
    if(!size){ toast('Enter a size', 'err'); return false; }
    dbRef('screwItems/' + uid()).set({ size, bundleSize, qtyBundles, reorderQty, reorderSent:false, supplierId });
    return true;
  });
}

function openEditScrewModal(id){
  const item = State.screwItems[id];
  openModal('Edit ' + item.size, `
    <label>Size</label>
    <input type="text" id="m-size" value="${escapeHtml(item.size)}">
    <div class="row2">
      <div><label>Bundle size</label><input type="number" id="m-bundle" value="${item.bundleSize}"></div>
      <div><label>Reorder at (bundles)</label><input type="number" id="m-reorder" value="${item.reorderQty}"></div>
    </div>
    ${supplierSelectHtml('m-supplier', item.supplierId)}
    <div class="btn-row"><button class="btn btn-danger" id="m-delete" type="button">Delete this item</button></div>
  `, ()=>{
    const size = document.getElementById('m-size').value.trim();
    const bundleSize = parseInt(document.getElementById('m-bundle').value) || 500;
    const reorderQty = parseInt(document.getElementById('m-reorder').value) || 0;
    const supplierId = document.getElementById('m-supplier').value || null;
    if(!size){ toast('Enter a size', 'err'); return false; }
    dbRef('screwItems/' + id).update({ size, bundleSize, reorderQty, supplierId });
    checkReorder('screw', id, size, item.qtyBundles, reorderQty, item.reorderSent, supplierId);
    return true;
  });
  setTimeout(()=>{

function openRestockModal(kind, id){
  const item = kind === 'screw' ? State.screwItems[id] : State.consumableTypes[id];
  const label = kind === 'screw' ? item.size : item.name;
  openModal('Restock ' + label, `
    <label>Bundles to add</label>
    <input type="number" id="m-add" value="1" min="1">
  `, ()=>{
    const add = parseInt(document.getElementById('m-add').value) || 0;
    if(add <= 0){ toast('Enter a positive amount', 'err'); return false; }
    const newQty = item.qtyBundles + add;
    dbRef('screwItems/' + id + '/qtyBundles').set(newQty);
    checkReorder('screw', id, label, newQty, item.reorderQty, item.reorderSent, item.supplierId);
    toast('Restocked ' + label, 'ok');
    return true;
  });
}

function openHandOutModal(kind, id){
  const item = State.screwItems[id];
  const people = Object.entries(State.people || {}).sort((a,b)=> a[1].name.localeCompare(b[1].name));
  const peopleOpts = people.map(([pid,p])=> `<option value="${pid}">${escapeHtml(p.name)}</option>`).join('');
  openModal('Hand out ' + item.size, `
    <label>Person</label>
    <select id="m-person">
      <option value="__new">+ New person…</option>
      ${peopleOpts}
    </select>
    <div id="m-newname-wrap" style="display:none">
      <label>New person's name</label>
      <input type="text" id="m-newname">
    </div>
    <div class="row2">
      <div><label>Qty (bundles)</label><input type="number" id="m-qty" value="1" min="1"></div>
      <div><label>Date</label><input type="date" id="m-date" value="${todayStr()}"></div>
    </div>
    <div class="sub" style="margin-top:8px">On hand: ${item.qtyBundles} bundle(s)</div>
  `, ()=>{
    const qty = parseInt(document.getElementById('m-qty').value) || 0;
    const date = document.getElementById('m-date').value || todayStr();
    let personSel = document.getElementById('m-person').value;
    if(qty <= 0){ toast('Enter a positive qty', 'err'); return false; }
    if(qty > item.qtyBundles){ if(!confirm('That is more than the ' + item.qtyBundles + ' bundle(s) on hand. Continue anyway?')) return false; }

    const finishPersonId = (personId)=>{
      const newQty = item.qtyBundles - qty;
      dbRef('screwItems/' + id + '/qtyBundles').set(newQty);
      checkReorder('screw', id, item.size, newQty, item.reorderQty, item.reorderSent, item.supplierId);
      dbRef('transactions/' + uid()).set({
        personId, itemType:'screw', itemId:id, itemLabel: item.size, qty, date, month: monthKey(date)
      });
      toast('Handed out ' + qty + ' bundle(s) of ' + item.size, 'ok');
    };

    if(personSel === '__new'){
      const name = document.getElementById('m-newname').value.trim();
      if(!name){ toast('Enter a name', 'err'); return false; }
      const newId = uid();
      dbRef('people/' + newId).set({ name });
      finishPersonId(newId);
    } else {
      finishPersonId(personSel);
    }
    return true;
  });
  setTimeout(()=>{
    const sel = document.getElementById('m-person');
    const wrap = document.getElementById('m-newname-wrap');
    sel.onchange = ()=> wrap.style.display = (sel.value==='__new') ? 'block' : 'none';
  });
}

/* ---------- Consumables Tab (thinners / terps / wood stopping) ---------- */
function renderConsumablesTab(){
  const container = el('div','');
  const types = Object.entries(State.consumableTypes || {}).sort((a,b)=> a[1].name.localeCompare(b[1].name));

  types.forEach(([tid, type])=>{
    const units = Object.entries(State.consumableUnits || {}).filter(([uidk,u])=> u.typeId === tid);
    const activeCount = units.filter(([uidk,u])=> u.fillLevel !== 'Finished').length;
    const low = activeCount <= type.reorderQty;

    const card = el('div','card');
    const head = el('div','');
    const supplierName = type.supplierId && State.suppliers[type.supplierId] ? State.suppliers[type.supplierId].name : null;
    head.innerHTML = `
      <h2>${escapeHtml(type.name)} ${low ? '<span class="pill low" style="margin-left:8px">Reorder</span>' : '<span class="pill ok" style="margin-left:8px">OK</span>'}</h2>
      <div class="sub">${activeCount} active container(s) · reorder at ${type.reorderQty}${supplierName ? ' · supplier: ' + escapeHtml(supplierName) : ''}</div>
    `;
    card.appendChild(head);

    if(units.length === 0){
      card.appendChild(elHtml('div','empty','No containers logged yet.'));
    } else {
      const table = document.createElement('table');
      table.innerHTML = `<thead><tr><th>Container</th><th>Started</th><th>Fill level</th></tr></thead>`;
      const tbody = document.createElement('tbody');
      units.sort((a,b)=> (a[1].createdDate||'').localeCompare(b[1].createdDate||''));
      units.forEach(([unitId, unit], idx)=>{
        const tr = document.createElement('tr');
        const nameTd = document.createElement('td');
        nameTd.textContent = type.name + ' #' + (idx+1);
        const dateTd = document.createElement('td');
        dateTd.textContent = unit.createdDate || '—';
        const fillTd = document.createElement('td');
        const toggle = el('div','fill-toggle');
        FILL_LEVELS.forEach(level=>{
          const opt = document.createElement('button');
          opt.className = 'fill-opt' + (unit.fillLevel===level ? ' active' + (level==='Finished' ? ' finished':'') : '');
          opt.textContent = level;
          opt.onclick = ()=>{
            dbRef('consumableUnits/' + unitId + '/fillLevel').set(level);
            setTimeout(()=>{
              const freshUnits = Object.entries(State.consumableUnits||{}).filter(([k,u])=>u.typeId===tid);
              const freshActive = freshUnits.filter(([k,u])=>u.fillLevel!=='Finished').length;
              checkReorder('consumable', tid, type.name, freshActive, type.reorderQty, type.reorderSent, type.supplierId);
            }, 150);
          };
          toggle.appendChild(opt);
        });
        fillTd.appendChild(toggle);
        tr.appendChild(nameTd); tr.appendChild(dateTd); tr.appendChild(fillTd);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      card.appendChild(table);
    }

    if(can('manageConsumables')){
      const row = el('div','btn-row');
      const addUnitBtn = document.createElement('button');
      addUnitBtn.className = 'btn btn-sm btn-ghost';
      addUnitBtn.textContent = '+ New container';
      addUnitBtn.onclick = ()=>{
        dbRef('consumableUnits/' + uid()).set({ typeId: tid, fillLevel:'Full', createdDate: todayStr() });
        setTimeout(()=>{
          const freshUnits = Object.entries(State.consumableUnits||{}).filter(([k,u])=>u.typeId===tid);
          const freshActive = freshUnits.filter(([k,u])=>u.fillLevel!=='Finished').length;
          checkReorder('consumable', tid, type.name, freshActive, type.reorderQty, type.reorderSent, type.supplierId);
        }, 150);
      };
      row.appendChild(addUnitBtn);

      if(can('manageItems')){
        const editBtn = document.createElement('button');
        editBtn.className = 'btn btn-sm btn-ghost';
        editBtn.textContent = 'Edit type / reorder qty';
        editBtn.onclick = ()=> openEditConsumableTypeModal(tid);
        row.appendChild(editBtn);
      }
      card.appendChild(row);
    }

    container.appendChild(card);
  });

  if(can('manageItems')){
    const addCard = el('div','card');
    addCard.innerHTML = `<h2>Add a new item type</h2><div class="sub">For thinners, terps, wood stopping on rags, or anything else tracked by container fill level.</div>`;
    const addRow = el('div','btn-row');
    const addBtn = document.createElement('button');
    addBtn.className = 'btn btn-amber';
    addBtn.textContent = '+ Add item type';
    addBtn.onclick = openAddConsumableTypeModal;
    addRow.appendChild(addBtn);
    addCard.appendChild(addRow);
    container.appendChild(addCard);
  }

  if(types.length === 0 && !can('manageItems')){
    container.appendChild(elHtml('div','empty','No item types set up yet.'));
  }

  return container;
}

    <input type="text" id="m-name">
    <label>Reorder at (active containers)</label>
    <input type="number" id="m-reorder" value="1">
    ${supplierSelectHtml('m-supplier', null)}

/* ---------- People Tab ---------- */
function renderPeopleTab(){
  const container = el('div','');
  const people = Object.entries(State.people || {}).sort((a,b)=> a[1].name.localeCompare(b[1].name));

  if(people.length === 0){
    const card = el('div','card');
    card.appendChild(elHtml('div','empty','No people added yet. People are added automatically the first time you hand something out to them.'));
    container.appendChild(card);
  }

  people.forEach(([pid, person])=>{
    const txns = Object.entries(State.transactions || {}).filter(([tid,t])=> t.personId === pid);
    const byMonth = {};
    txns.forEach(([tid,t])=>{
      byMonth[t.month] = byMonth[t.month] || [];
      byMonth[t.month].push(t);
    });
    const months = Object.keys(byMonth).sort().reverse();

    const card = el('div','card');
    const head = el('div','');
    head.innerHTML = `<h2>${escapeHtml(person.name)}</h2><div class="sub">${txns.length} item(s) taken all-time</div>`;
    card.appendChild(head);

    if(months.length === 0){
      card.appendChild(elHtml('div','empty','No items handed out to this person yet.'));
    } else {
      months.forEach(mk=>{
        const list = byMonth[mk];
        const total = list.reduce((s,t)=> s + t.qty, 0);
        const details = document.createElement('details');
        details.className = 'person-month';
        const summary = document.createElement('summary');
        summary.innerHTML = `<span>${monthLabel(mk)}</span><span class="total">${total} item(s)</span>`;
        details.appendChild(summary);
        const body = el('div','body');
        const table = document.createElement('table');
        table.innerHTML = `<thead><tr><th>Date</th><th>Item</th><th>Qty</th></tr></thead>`;
        const tbody = document.createElement('tbody');
        list.sort((a,b)=> a.date.localeCompare(b.date)).forEach(t=>{
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${t.date}</td><td>${escapeHtml(t.itemLabel)}</td><td class="num">${t.qty}</td>`;
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        body.appendChild(table);
        details.appendChild(body);
        card.appendChild(details);
      });
    }

    if(can('manageItems')){
      const row = el('div','btn-row');
      const delBtn = smallBtn('Remove person', ()=>{
        if(confirm('Remove ' + person.name + '? Their history will be kept but unlinked.')){
          dbRef('people/' + pid).remove();
        }
      });
      row.appendChild(delBtn);
      card.appendChild(row);
    }

    container.appendChild(card);
  });

  return container;
}

/* ---------- Reports / Export Tab ---------- */
function renderReportsTab(){
  const container = el('div','');
  const card = el('div','card');
  card.innerHTML = `<h2>Export to Excel</h2><div class="sub">Export handout history for one person, or everyone, for a given month.</div>`;

  const people = Object.entries(State.people || {}).sort((a,b)=> a[1].name.localeCompare(b[1].name));
  const months = Array.from(new Set(Object.values(State.transactions||{}).map(t=>t.month))).sort().reverse();

  const formWrap = el('div','');
  formWrap.innerHTML = `
    <div class="row2">
      <div>
        <label>Person</label>
        <select id="rep-person">
          <option value="__all">All people</option>
          ${people.map(([pid,p])=> `<option value="${pid}">${escapeHtml(p.name)}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>Month</label>
        <select id="rep-month">
          <option value="__all">All months</option>
          ${months.map(mk=> `<option value="${mk}">${monthLabel(mk)}</option>`).join('')}
        </select>
      </div>
    </div>
  `;
  card.appendChild(formWrap);

  if(can('exportExcel')){
    const row = el('div','btn-row');
    const exportBtn = document.createElement('button');
    exportBtn.className = 'btn btn-amber';
    exportBtn.textContent = 'Export to Excel';
    exportBtn.onclick = ()=>{
      const personSel = document.getElementById('rep-person').value;
      const monthSel = document.getElementById('rep-month').value;
      exportToExcel(personSel, monthSel);
    };
    row.appendChild(exportBtn);
    card.appendChild(row);
  }

  container.appendChild(card);

  // Live low-stock summary, useful alongside reports
  const stockCard = el('div','card');
  stockCard.innerHTML = `<h2>Items at or below reorder level</h2>`;
  const lowScrews = Object.values(State.screwItems||{}).filter(i=> i.qtyBundles <= i.reorderQty);
  const lowCons = Object.values(State.consumableTypes||{}).filter(t=>{
    const active = Object.values(State.consumableUnits||{}).filter(u=>u.typeId && State.consumableTypes[Object.keys(State.consumableTypes).find(k=>State.consumableTypes[k]===t)]).length;
    return true; // recalculated properly below
  });
  const lowConsList = Object.entries(State.consumableTypes||{}).filter(([tid,t])=>{
    const active = Object.values(State.consumableUnits||{}).filter(u=>u.typeId===tid && u.fillLevel!=='Finished').length;
    return active <= t.reorderQty;
  });
  if(lowScrews.length===0 && lowConsList.length===0){
    stockCard.appendChild(elHtml('div','empty','Nothing currently needs reordering.'));
  } else {
    const ul = document.createElement('ul');
    ul.style.margin = '0'; ul.style.paddingLeft = '18px'; ul.style.fontSize='13.5px';
    lowScrews.forEach(i=>{ const li=document.createElement('li'); li.textContent = `${i.size} — ${i.qtyBundles} bundle(s) left`; ul.appendChild(li); });
    lowConsList.forEach(([tid,t])=>{
      const active = Object.values(State.consumableUnits||{}).filter(u=>u.typeId===tid && u.fillLevel!=='Finished').length;
      const li=document.createElement('li'); li.textContent = `${t.name} — ${active} active container(s) left`; ul.appendChild(li);
    });
    stockCard.appendChild(ul);
  }
  container.appendChild(stockCard);

  return container;
}

function exportToExcel(personSel, monthSel){
  let txns = Object.values(State.transactions || {});
  if(personSel !== '__all') txns = txns.filter(t=> t.personId === personSel);
  if(monthSel !== '__all') txns = txns.filter(t=> t.month === monthSel);

  const rows = txns.sort((a,b)=> a.date.localeCompare(b.date)).map(t=>({
    Date: t.date,
    Month: monthLabel(t.month),
    Person: (State.people[t.personId] && State.people[t.personId].name) || 'Unknown',
    Item: t.itemLabel,
    Type: t.itemType === 'screw' ? 'Screws' : 'Consumable',
    Qty: t.qty
  }));

  if(rows.length === 0){ toast('Nothing to export for that selection', 'err'); return; }

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Handouts');
  const fname = 'stock-handouts-' + todayStr() + '.xlsx';
  XLSX.writeFile(wb, fname);
  toast('Exported ' + fname, 'ok');
}

      const consCount = Object.values(State.consumableTypes||{}).filter(t=> t.supplierId===sid).length;
      const lowCount = Object.values(State.screwItems||{}).filter(i=> i.supplierId===sid && i.qtyBundles<=i.reorderQty).length +
        Object.entries(State.consumableTypes||{}).filter(([tid,t])=>{
          if(t.supplierId!==sid) return false;
          const active = Object.values(State.consumableUnits||{}).filter(u=>u.typeId===tid && u.fillLevel!=='Finished').length;
          return active <= t.reorderQty;
        }).length;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escapeHtml(s.name)}</td>
        <td>${escapeHtml(s.contactPerson||'—')}</td>
        <td>${escapeHtml(s.email||'—')}</td>
        <td>${escapeHtml(s.ccEmail||'—')}</td>
        <td class="num">${screwCount + consCount}${lowCount>0 ? ' <span class="pill low">'+lowCount+' need reorder</span>' : ''}</td>
        <td></td>
      `;
      const actionsTd = tr.lastElementChild;
      if(can('manageItems')){
        actionsTd.appendChild(smallBtn('Edit', ()=> openEditSupplierModal(sid)));
        const sendBtn = smallBtn('Send reorder email now', ()=> sendReorderEmailNowForSupplier(sid));
        sendBtn.style.marginLeft = '6px';
        actionsTd.appendChild(sendBtn);
      }
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    card.appendChild(table);
  }

  if(can('manageItems')){
    const row = el('div','btn-row');
    const addBtn = document.createElement('button');
    addBtn.className = 'btn btn-amber';
    addBtn.textContent = '+ Add supplier';
    addBtn.onclick = openAddSupplierModal;
    row.appendChild(addBtn);
    card.appendChild(row);
  }
  container.appendChild(card);

  return container;
}

function openAddSupplierModal(){
  openModal('Add supplier', `
    <label>Supplier name</label>
    <input type="text" id="m-name">
    <label>Contact person</label>
    <input type="text" id="m-contact">
    <label>Reorder email address</label>
    <input type="text" id="m-email">
    <label>CC email (optional)</label>
    <input type="text" id="m-cc">
  `, ()=>{
    const name = document.getElementById('m-name').value.trim();
    const contactPerson = document.getElementById('m-contact').value.trim();
    const email = document.getElementById('m-email').value.trim();
    const ccEmail = document.getElementById('m-cc').value.trim();
    if(!name){ toast('Enter a supplier name', 'err'); return false; }
    dbRef('suppliers/' + uid()).set({ name, contactPerson, email, ccEmail });
    return true;
  });
}

function openEditSupplierModal(sid){
  const s = State.suppliers[sid];
  openModal('Edit ' + s.name, `
    <label>Supplier name</label>
    <input type="text" id="m-name" value="${escapeHtml(s.name)}">
    <label>Contact person</label>
    <input type="text" id="m-contact" value="${escapeHtml(s.contactPerson||'')}">
    <label>Reorder email address</label>
    <input type="text" id="m-email" value="${escapeHtml(s.email||'')}">
    <label>CC email (optional)</label>
    <input type="text" id="m-cc" value="${escapeHtml(s.ccEmail||'')}">
    <div class="btn-row"><button class="btn btn-danger" id="m-delete" type="button">Delete this supplier</button></div>
  `, ()=>{
    const name = document.getElementById('m-name').value.trim();
    const contactPerson = document.getElementById('m-contact').value.trim();
    const email = document.getElementById('m-email').value.trim();
    const ccEmail = document.getElementById('m-cc').value.trim();
    if(!name){ toast('Enter a supplier name', 'err'); return false; }
    dbRef('suppliers/' + sid).update({ name, contactPerson, email, ccEmail });
    return true;
  });
  setTimeout(()=>{
    const del = document.getElementById('m-delete');
    if(del) del.onclick = ()=>{
      if(confirm('Delete supplier ' + s.name + '? Items assigned to them will be unassigned, not deleted.')){
        dbRef('suppliers/' + sid).remove();
        Object.entries(State.screwItems||{}).filter(([k,i])=>i.supplierId===sid).forEach(([k])=> dbRef('screwItems/'+k+'/supplierId').set(null));
        Object.entries(State.consumableTypes||{}).filter(([k,t])=>t.supplierId===sid).forEach(([k])=> dbRef('consumableTypes/'+k+'/supplierId').set(null));
        closeModal();
      }
    };
  });
}

/* ---------- Admin Tab ---------- */
function renderAdminTab(){
  const container = el('div','');
  const users = Object.entries(State.users || {}).sort((a,b)=> a[1].username.localeCompare(b[1].username));

  const card = el('div','card');
  card.innerHTML = `<h2>Users</h2><div class="sub">Manage who can log in and what each person can do.</div>`;
  const table = document.createElement('table');
  table.innerHTML = `<thead><tr><th>Username</th><th>Role</th><th></th></tr></thead>`;
  const tbody = document.createElement('tbody');
  users.forEach(([id,u])=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${escapeHtml(u.username)}</td><td>${u.isRoot ? 'Root' : 'Standard'}</td><td></td>`;
    const actionsTd = tr.lastElementChild;
    if(State.currentUser.isRoot){
      actionsTd.appendChild(smallBtn('Edit', ()=> openEditUserModal(id)));
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  card.appendChild(table);

  if(State.currentUser.isRoot){
    const row = el('div','btn-row');
    const addBtn = document.createElement('button');
    addBtn.className = 'btn btn-amber';
    addBtn.textContent = '+ Add user';
    addBtn.onclick = openAddUserModal;
    row.appendChild(addBtn);
    card.appendChild(row);
  }
  container.appendChild(card);

  if(State.currentUser.isRoot){
    const shareCard = el('div','card');
    shareCard.innerHTML = `<h2>Share this app</h2><div class="sub">Send this page's link to your team so they can log in from their own phone or laptop.</div>`;
    const linkRow = el('div','btn-row');
    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn';
    copyBtn.textContent = 'Copy link';
    copyBtn.onclick = ()=>{
      navigator.clipboard.writeText(window.location.href).then(()=> toast('Link copied', 'ok'));
    };
    linkRow.appendChild(copyBtn);
    shareCard.appendChild(linkRow);
    container.appendChild(shareCard);

    const emailCard = el('div','card');
    emailCard.innerHTML = `<h2>Reorder email settings</h2><div class="sub">Where reorder alerts get sent, via EmailJS.</div>`;
    const form = el('div','');
    form.innerHTML = `
      <label>Reorder alert recipient email</label>
      <input type="text" id="ec-email" value="${escapeHtml(CONFIG.REORDER_EMAIL||'')}">
      <label>EmailJS Service ID</label>
      <input type="text" id="ec-service" value="${escapeHtml(CONFIG.EMAILJS_SERVICE_ID||'')}">
      <label>EmailJS Template ID</label>
      <input type="text" id="ec-template" value="${escapeHtml(CONFIG.EMAILJS_TEMPLATE_ID||'')}">
      <label>EmailJS Public Key</label>
      <input type="text" id="ec-key" value="${escapeHtml(CONFIG.EMAILJS_PUBLIC_KEY||'')}">
      <div class="btn-row"><button class="btn btn-amber" id="ec-save">Save</button></div>
    `;
    emailCard.appendChild(form);
    container.appendChild(emailCard);
    setTimeout(()=>{
      document.getElementById('ec-save').onclick = ()=>{
        CONFIG.REORDER_EMAIL = document.getElementById('ec-email').value.trim();
        CONFIG.EMAILJS_SERVICE_ID = document.getElementById('ec-service').value.trim();
        CONFIG.EMAILJS_TEMPLATE_ID = document.getElementById('ec-template').value.trim();
        CONFIG.EMAILJS_PUBLIC_KEY = document.getElementById('ec-key').value.trim();
        saveConfig(CONFIG);
        if(CONFIG.EMAILJS_PUBLIC_KEY){ try{ emailjs.init(CONFIG.EMAILJS_PUBLIC_KEY); }catch(e){} }
        toast('Email settings saved on this device', 'ok');
      };
    });
  }

  return container;
}

function openAddUserModal(){
  openModal('Add user', `
    <label>Username</label>
    <input type="text" id="m-username">
    <label>PIN (4 digits)</label>
    <input type="text" id="m-pin" inputmode="numeric">
    <label>Email signature (pasted from your Outlook signature — used to sign reorder emails)</label>
    <textarea id="m-signature" rows="4" style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:7px;font-size:14px;font-family:var(--sans);"></textarea>
    <label><input type="checkbox" id="m-isroot" style="width:auto;display:inline-block;margin-right:6px"> Root user (full access, manages other users)</label>
    <div id="m-perms-wrap">
      <label>Permissions</label>
      <div class="checklist">
        <label><input type="checkbox" id="p-handOut" checked> Hand out items</label>
        <label><input type="checkbox" id="p-manageConsumables" checked> Update container fill levels</label>
        <label><input type="checkbox" id="p-manageItems"> Add/edit items &amp; reorder levels</label>
        <label><input type="checkbox" id="p-viewReports" checked> View reports</label>
        <label><input type="checkbox" id="p-exportExcel" checked> Export to Excel</label>
      </div>
    </div>
  `, ()=>{
    const username = document.getElementById('m-username').value.trim();
    const pin = document.getElementById('m-pin').value.trim();
    const signature = document.getElementById('m-signature').value.trim();
    const isRoot = document.getElementById('m-isroot').checked;
    if(!username || !pin){ toast('Enter a username and PIN', 'err'); return false; }
    if(Object.values(State.users||{}).some(u=>u.username.toLowerCase()===username.toLowerCase())){
      toast('That username is taken', 'err'); return false;
    }
    const perms = {
      handOut: document.getElementById('p-handOut').checked,
      manageConsumables: document.getElementById('p-manageConsumables').checked,
      manageItems: document.getElementById('p-manageItems').checked,
      viewReports: document.getElementById('p-viewReports').checked,
      exportExcel: document.getElementById('p-exportExcel').checked,
      manageUsers: false
    };
    dbRef('users/' + uid()).set({ username, pin, signature, isRoot, perms });
    return true;
  });
}

function openEditUserModal(id){
  const u = State.users[id];
  const perms = u.perms || DEFAULT_PERMS;
  openModal('Edit ' + u.username, `
    <label>Username</label>
    <input type="text" id="m-username" value="${escapeHtml(u.username)}">
    <label>PIN</label>
    <input type="text" id="m-pin" value="${escapeHtml(String(u.pin))}" inputmode="numeric">
    <label>Email signature (pasted from your Outlook signature — used to sign reorder emails)</label>
    <textarea id="m-signature" rows="4" style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:7px;font-size:14px;font-family:var(--sans);">${escapeHtml(u.signature||'')}</textarea>
    <label><input type="checkbox" id="m-isroot" ${u.isRoot?'checked':''} style="width:auto;display:inline-block;margin-right:6px"> Root user</label>
    <div class="checklist" style="margin-top:8px">
      <label><input type="checkbox" id="p-handOut" ${perms.handOut?'checked':''}> Hand out items</label>
      <label><input type="checkbox" id="p-manageConsumables" ${perms.manageConsumables?'checked':''}> Update container fill levels</label>
      <label><input type="checkbox" id="p-manageItems" ${perms.manageItems?'checked':''}> Add/edit items &amp; reorder levels</label>
      <label><input type="checkbox" id="p-viewReports" ${perms.viewReports?'checked':''}> View reports</label>
      <label><input type="checkbox" id="p-exportExcel" ${perms.exportExcel?'checked':''}> Export to Excel</label>
    </div>
    <div class="btn-row"><button class="btn btn-danger" id="m-delete" type="button">Delete this user</button></div>
  `, ()=>{
    const username = document.getElementById('m-username').value.trim();
    const pin = document.getElementById('m-pin').value.trim();
    const signature = document.getElementById('m-signature').value.trim();
    const isRoot = document.getElementById('m-isroot').checked;
    if(!username || !pin){ toast('Enter a username and PIN', 'err'); return false; }
    const newPerms = {
      handOut: document.getElementById('p-handOut').checked,
      manageConsumables: document.getElementById('p-manageConsumables').checked,
      manageItems: document.getElementById('p-manageItems').checked,
      viewReports: document.getElementById('p-viewReports').checked,
      exportExcel: document.getElementById('p-exportExcel').checked,
      manageUsers: false
    };
    dbRef('users/' + id).update({ username, pin, signature, isRoot, perms: newPerms });
    return true;
  });
  setTimeout(()=>{
    const del = document.getElementById('m-delete');
    if(del) del.onclick = ()=>{
      if(id === State.currentUser.id){ toast("You can't delete yourself while logged in", 'err'); return; }
      if(confirm('Delete user ' + u.username + '?')){
        dbRef('users/' + id).remove();
        closeModal();
      }
    };
  });
}

/* ---------- Modal helper ---------- */
function openModal(title, bodyHtml, onSave){
  closeModal();
  const bg = el('div','modal-bg');
  bg.id = 'active-modal';
  const modal = el('div','modal');
  modal.innerHTML = `<button class="modal-close" id="modal-x">&times;</button><h3>${title}</h3><div id="modal-body">${bodyHtml}</div><div class="btn-row"><button class="btn btn-amber" id="modal-save">Save</button><button class="btn btn-ghost" id="modal-cancel">Cancel</button></div>`;
  bg.appendChild(modal);
  document.body.appendChild(bg);
  document.getElementById('modal-x').onclick = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-save').onclick = ()=>{
    const ok = onSave();
    if(ok !== false) closeModal();
  };
  bg.addEventListener('click', e=>{ if(e.target === bg) closeModal(); });
}
function closeModal(){
  const m = document.getElementById('active-modal');
  if(m) m.remove();
}

/* =========================================================================
   SETUP SCREEN (first run — root pastes Firebase config)
   ========================================================================= */
function renderSetupScreen(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const wrap = el('div','setup-screen');
  wrap.innerHTML = `
    <h1 style="margin-top:40px">First-time setup</h1>
    <div class="sub" style="margin-bottom:18px">Paste your Firebase project config below. See SETUP.md for how to create one. This is a one-time step per device/browser the first time this file is opened from a new host — after that it's saved.</div>
    <label>Firebase config (paste the whole JS object from your Firebase console)</label>
    <textarea id="fb-config" rows="8" style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:10px;border-radius:7px;font-family:var(--mono);font-size:12.5px;" placeholder='{
  "apiKey": "...",
  "authDomain": "...",
  "databaseURL": "...",
  "projectId": "...",
  "storageBucket": "...",
  "messagingSenderId": "...",
  "appId": "..."
}'></textarea>
    <div class="btn-row"><button class="btn btn-amber" id="fb-save">Save &amp; continue</button></div>
    <div class="err" id="fb-err"></div>
  `;
  app.appendChild(wrap);
  document.getElementById('fb-save').onclick = ()=>{
    const raw = document.getElementById('fb-config').value.trim();
    try{
      const parsed = JSON.parse(raw);
      CONFIG.FIREBASE_CONFIG = parsed;
      saveConfig(CONFIG);
      initFirebase();
      seedRootUserIfNeeded();
    }catch(e){
      document.getElementById('fb-err').textContent = 'Could not parse that as JSON. Make sure it is valid JSON (keys in quotes).';
    }
  };
}

function seedRootUserIfNeeded(){
  setTimeout(()=>{
    if(!State.db) return;
    dbRef('users').once('value').then(snap=>{
      if(!snap.exists() || Object.keys(snap.val()||{}).length === 0){
        const id = uid();
        dbRef('users/' + id).set({
          username: 'root', pin: '0000', isRoot: true,
          perms: { manageUsers:true, manageItems:true, handOut:true, manageConsumables:true, viewReports:true, exportExcel:true }
        }).then(()=> toast('Created default login: root / 0000 — change the PIN in Admin', 'ok'));
      }
    });
  }, 1200);
}

/* =========================================================================
   BOOT
   ========================================================================= */
if(CONFIG.EMAILJS_PUBLIC_KEY){ try{ emailjs.init(CONFIG.EMAILJS_PUBLIC_KEY); }catch(e){} }
initFirebase();
</script>
